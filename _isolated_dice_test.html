<!DOCTYPE html>
<html>
<head><title>Isolated Dice Test</title></head>
<body style="margin:0;background:#222;">
<div id="dice-box" style="width:330px;height:200px;background:#000;"></div>
<script type="module">
  const { default: DiceBox } = await import('https://unpkg.com/@3d-dice/dice-box@1.1.3/dist/dice-box.es.min.js');
  const box = new DiceBox({
    container: '#dice-box',
    assetPath: 'assets/',
    origin: 'https://unpkg.com/@3d-dice/dice-box@1.1.3/dist/',
    externalThemes: {
      stellar: new URL('assets/dice-box/themes/stellar', location.href).href
    },
    theme: 'stellar',
    themeColor: '#0284c7',
    scale: 18,
    gravity: 2.5,
    friction: 0.8,
    restitution: 0.5
  });
  await box.init();
  window.__box = box;
  window.__ready = true;
</script>
</body>
</html>
