<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rolador de Dados 3D — Board Bots Tools</title>
<meta name="description" content="Rolador de dados virtual 3D com física real e efeitos visuais personalizados.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-color: #0b0e12;
  --panel-bg: rgba(24, 29, 37, 0.95);
  --text-main: #eef1f5;
  --text-dim: #9aa4b2;
  --border: #2b323d;
  --blue: #4f8cff;
  --blue-dark: #173a75;
  --red: #d64545;
  --font-display: 'Poppins', 'Segoe UI', sans-serif;
  --font-body: 'Inter', 'Segoe UI', sans-serif;
}

* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  font-family: var(--font-body);
  color: var(--text-main);
  background-color: var(--bg-color);
  background-image: radial-gradient(circle at 50% 50%, #151a22 0%, var(--bg-color) 100%);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

#dice-box {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  z-index: 10;
}

#vfx-canvas {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  pointer-events: none; z-index: 20;
}

.sidebar {
  position: fixed; top: 20px; left: 20px; bottom: 20px; width: 340px;
  background: var(--panel-bg); border: 1px solid var(--border); border-radius: 12px;
  backdrop-filter: blur(10px); z-index: 30;
  display: flex; flex-direction: column;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto; padding: 20px;
}
.sidebar.hidden-ui { transform: translateX(-120%); }
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.sidebar-header { margin-bottom: 15px; text-align: center; }
.sidebar-header h1 { margin: 0; font-family: var(--font-display); font-size: 1.5em; color: var(--blue); }
.sidebar-header p { margin: 4px 0 0; color: var(--text-dim); font-size: 0.85em; }

.section-title { font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin: 15px 0 10px; font-weight: 700; }

.die-row {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px; margin-bottom: 8px;
}
.die-label { font-weight: 700; font-size: 1.1em; width: 40px; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper-btn {
  width: 28px; height: 28px; border-radius: 50%; border: none;
  background: var(--border); color: #fff; cursor: pointer; font-weight: bold;
}
.stepper-count { width: 24px; text-align: center; font-weight: bold; }

.form-group { margin-bottom: 12px; }
.form-group label { display: block; margin-bottom: 6px; color: var(--text-dim); font-size: 0.85em; font-weight: 600; }
.form-control {
  width: 100%; padding: 8px; background: rgba(0,0,0,0.2); border: 1px solid var(--border);
  border-radius: 6px; color: #fff; font-family: var(--font-body); font-size: 0.9em;
}
.color-picker-wrap { display: flex; gap: 10px; align-items: center; }
.color-picker { width: 36px; height: 36px; padding: 0; border: none; border-radius: 4px; cursor: pointer; }

.preset-row { display: flex; gap: 8px; margin-bottom: 15px; }
.preset-row select { flex: 1; }
.btn-icon {
  background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  color: var(--text-dim); border-radius: 6px; padding: 0 10px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.btn-icon:hover { color: #fff; border-color: #fff; }

.actions-row { display: flex; gap: 10px; margin-top: 20px; }
.btn-main, .btn-secondary {
  flex: 1; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer;
  border: none; display: flex; justify-content: center; align-items: center; gap: 8px;
}
.btn-main { background: var(--blue); color: #fff; box-shadow: 0 4px 12px rgba(79,140,255,0.3); }
.btn-main:hover { filter: brightness(1.1); }
.btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
.btn-secondary:hover { color: var(--text-main); border-color: var(--text-main); }

#result-panel {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
  background: var(--panel-bg); border: 1px solid var(--blue);
  box-shadow: 0 0 50px rgba(79,140,255,0.2);
  border-radius: 16px; padding: 30px; width: 90%; max-width: 600px;
  z-index: 40; display: none; opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
#result-panel.show { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
.result-total {
  font-family: var(--font-display); font-size: 4em; font-weight: 800; color: var(--blue);
  text-align: center; line-height: 1; margin-bottom: 20px;
  text-shadow: 0 4px 20px rgba(79,140,255,0.4);
}
.result-grid {
  display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-height: 40vh; overflow-y: auto; padding: 10px;
}
.result-die {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 60px; height: 60px; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  border-radius: 12px; position: relative;
}
.result-die-val { font-size: 1.5em; font-weight: 800; color: #fff; }
.result-die-type { font-size: 0.65em; color: var(--text-dim); text-transform: uppercase; font-weight: 700; }
.close-result-btn {
  margin-top: 24px; width: 100%; padding: 14px; background: transparent; border: 1px solid var(--border);
  color: var(--text-dim); border-radius: 8px; cursor: pointer; font-weight: 600;
}
.close-result-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }

.btn-home {
  position: absolute; top: 12px; right: 12px; padding: 8px 12px;
  background: var(--panel-bg); border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 8px; text-decoration: none; font-size: 0.85em; font-weight: 600;
  display: flex; align-items: center; gap: 6px; z-index: 100;
}
.btn-home:hover { color: #fff; border-color: #fff; }

@media (max-width: 600px) {
  .sidebar { width: calc(100% - 40px); top: auto; left: 20px; bottom: 20px; height: 75vh; }
  .sidebar.hidden-ui { transform: translateY(120%); }
  #result-panel { width: 95%; padding: 20px; }
  .result-total { font-size: 3em; }
}
</style>
</head>
<body>

<a href="../index.html" class="btn-home">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
  Voltar
</a>

<div id="dice-box"></div>
<canvas id="vfx-canvas"></canvas>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>Rolador 3D</h1>
    <p>Configure sua mesa</p>
  </div>

  <div class="section-title">Presets</div>
  <div class="preset-row">
    <select class="form-control" id="preset-selector" onchange="loadPreset(this.value)">
      <option value="">-- Escolha um Preset --</option>
    </select>
    <button class="btn-icon" onclick="savePreset()" title="Salvar Preset Atual">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    </button>
    <button class="btn-icon" onclick="deletePreset()" title="Excluir Preset" style="color: var(--red);">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
    </button>
  </div>

  <div class="section-title">Estilo Global</div>
  <div class="form-group">
    <label>Material / Tema</label>
    <select class="form-control" id="global-theme" onchange="updateGlobalConfig()">
      <option value="default">Plástico (Padrão)</option>
      <option value="rust">Enferrujado</option>
      <option value="wood">Madeira</option>
    </select>
  </div>
  <div class="form-group">
    <label>Cor Principal</label>
    <div class="color-picker-wrap">
      <input type="color" id="global-color" class="color-picker" onchange="updateGlobalConfig()">
      <span id="global-color-hex" style="font-size: 0.85em; color: var(--text-dim);">#ffffff</span>
    </div>
  </div>
  <div class="form-group">
    <label>Efeito Visual (Impacto)</label>
    <select class="form-control" id="global-vfx" onchange="updateGlobalConfig()">
      <option value="none">Nenhum</option>
      <option value="fire">🔥 Explosão de Fogo</option>
      <option value="star">✨ Impacto Estelar</option>
      <option value="blood">🩸 Poça de Sangue (Terror)</option>
      <option value="saber">⚔️ Sabre de Luz (Glow)</option>
    </select>
  </div>

  <div class="section-title">Dados</div>
  <div id="dice-list"></div>
  
  <div class="actions-row">
    <button class="btn-secondary" onclick="clearCounts()">Limpar</button>
    <button class="btn-main" onclick="rollDice()">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      Rolar
    </button>
  </div>
</div>

<div id="result-panel">
  <div class="result-total" id="result-total">0</div>
  <div class="result-grid" id="result-grid"></div>
  <button class="close-result-btn" onclick="closeResults()">Continuar</button>
</div>

<script type="module">
  import DiceBox from 'https://unpkg.com/@3d-dice/dice-box@1.1.3/dist/dice-box.es.min.js';

  const STORAGE_KEY = 'boardbots_dice_3d_v2';
  const PRESETS_KEY = 'boardbots_dice_presets_v2';
  const DICE_TYPES = [4, 6, 8, 10, 12, 20, 100];
  
  const DEFAULT_STATE = {
    counts: { 4:0, 6:0, 8:0, 10:0, 12:0, 20:0, 100:0 },
    theme: 'default',
    color: '#4f8cff',
    vfx: 'none'
  };

  let state = loadState();
  let presets = loadPresets();
  let diceBox = null;
  let isRolling = false;
  
  const vfxCanvas = document.getElementById('vfx-canvas');
  const ctx = vfxCanvas.getContext('2d');
  let particles = [];
  let bloodPuddles = [];

  function resizeCanvas() {
    vfxCanvas.width = window.innerWidth;
    vfxCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return JSON.parse(JSON.stringify(DEFAULT_STATE));
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function loadPresets() {
    try {
      const raw = localStorage.getItem(PRESETS_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return {};
  }

  function savePresets() {
    localStorage.setItem(PRESETS_KEY, JSON.stringify(presets));
  }

  function renderPresets() {
    const sel = document.getElementById('preset-selector');
    sel.innerHTML = '<option value="">-- Escolha um Preset --</option>';
    for (const name in presets) {
      sel.innerHTML += `<option value="${name}">${name}</option>`;
    }
  }

  window.savePreset = function() {
    const name = prompt("Nome do preset:");
    if (!name || name.trim() === '') return;
    presets[name.trim()] = JSON.parse(JSON.stringify(state));
    savePresets();
    renderPresets();
    document.getElementById('preset-selector').value = name.trim();
  }

  window.loadPreset = function(name) {
    if (!name || !presets[name]) return;
    state = JSON.parse(JSON.stringify(presets[name]));
    saveState();
    syncUIWithState();
    if (diceBox) {
      diceBox.updateConfig({ theme: state.theme, themeColor: state.color });
    }
  }

  window.deletePreset = function() {
    const sel = document.getElementById('preset-selector');
    const name = sel.value;
    if (!name || !presets[name]) return;
    if (confirm(`Excluir o preset "${name}"?`)) {
      delete presets[name];
      savePresets();
      renderPresets();
      sel.value = "";
    }
  }

  function syncUIWithState() {
    document.getElementById('global-theme').value = state.theme;
    document.getElementById('global-color').value = state.color;
    document.getElementById('global-color-hex').textContent = state.color;
    document.getElementById('global-vfx').value = state.vfx;
    renderDiceList();
  }

  window.updateGlobalConfig = function() {
    state.theme = document.getElementById('global-theme').value;
    state.color = document.getElementById('global-color').value;
    document.getElementById('global-color-hex').textContent = state.color;
    state.vfx = document.getElementById('global-vfx').value;
    saveState();

    if (diceBox) {
      diceBox.updateConfig({
        theme: state.theme,
        themeColor: state.color
      });
    }
  }

  function renderDiceList() {
    const list = document.getElementById('dice-list');
    list.innerHTML = DICE_TYPES.map(type => {
      const count = state.counts[type] || 0;
      return `
        <div class="die-row">
          <div class="die-label">d${type}</div>
          <div class="stepper">
            <button class="stepper-btn" onclick="incDie(${type}, -1)">−</button>
            <span class="stepper-count">${count}</span>
            <button class="stepper-btn" onclick="incDie(${type}, 1)">+</button>
          </div>
        </div>
      `;
    }).join('');
  }

  window.incDie = function(type, delta) {
    const current = state.counts[type] || 0;
    state.counts[type] = Math.max(0, current + delta);
    saveState();
    renderDiceList();
  }

  window.clearCounts = function() {
    DICE_TYPES.forEach(type => state.counts[type] = 0);
    saveState();
    renderDiceList();
  }

  async function initDiceBox() {
    diceBox = new DiceBox("#dice-box", {
      assetPath: 'https://unpkg.com/@3d-dice/dice-box@1.1.3/dist/assets/',
      theme: state.theme,
      themeColor: state.color,
      scale: 7, 
      gravity: 2.5,
      friction: 0.8,
      restitution: 0.5,
      spinForce: 8,
      throwForce: 6
    });

    await diceBox.init();
    
    diceBox.onDieComplete = (dieResult) => {
      if (state.vfx !== 'none') {
        spawnVFX(state.vfx, dieResult);
      }
    };

    diceBox.onRollComplete = (results) => {
      isRolling = false;
      setTimeout(() => showResultsModal(results), 800);
    };
  }

  function getScreenCoords(dieResult) {
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    const rx = (Math.random() - 0.5) * (window.innerWidth * 0.6);
    const ry = (Math.random() - 0.5) * (window.innerHeight * 0.6);
    return { x: cx + rx, y: cy + ry }; 
  }

  window.rollDice = function() {
    if (isRolling || !diceBox) return;
    
    let rollNotation = [];
    DICE_TYPES.forEach(type => {
      const count = state.counts[type] || 0;
      if (count > 0) {
        rollNotation.push(`${count}d${type}`);
      }
    });

    if (rollNotation.length === 0) {
      alert("Selecione ao menos um dado!");
      return;
    }

    document.getElementById('sidebar').classList.add('hidden-ui');
    document.getElementById('result-panel').classList.remove('show');
    
    particles = [];
    bloodPuddles = [];
    ctx.clearRect(0, 0, vfxCanvas.width, vfxCanvas.height);

    isRolling = true;
    diceBox.clear();
    diceBox.roll(rollNotation).catch(e => {
        console.error("Erro no roll:", e);
        isRolling = false;
        document.getElementById('sidebar').classList.remove('hidden-ui');
    });
  }

  function showResultsModal(results) {
    let total = 0;
    let flatResults = [];
    
    let arr = Array.isArray(results) ? results : [results];
    arr.forEach(group => {
      if (group.rolls) {
        group.rolls.forEach(r => {
          total += r.value;
          flatResults.push({ type: group.sides || group.dieType, val: r.value });
        });
      } else if (group.value) {
          total += group.value;
          flatResults.push({ type: group.sides, val: group.value });
      }
    });

    flatResults.sort((a, b) => {
      let tA = parseInt(String(a.type).replace(/\D/g, '')) || 0;
      let tB = parseInt(String(b.type).replace(/\D/g, '')) || 0;
      if (tA !== tB) return tA - tB;
      return a.val - b.val;
    });

    document.getElementById('result-total').textContent = total;
    document.getElementById('result-grid').innerHTML = flatResults.map(r => `
      <div class="result-die">
        <span class="result-die-val">${r.val}</span>
        <span class="result-die-type">d${r.type}</span>
      </div>
    `).join('');

    diceBox.clear(); 
    document.getElementById('result-panel').classList.add('show');
  }

  window.closeResults = function() {
    document.getElementById('result-panel').classList.remove('show');
    document.getElementById('sidebar').classList.remove('hidden-ui');
  }
  
  function spawnVFX(type, dieResult) {
    const coords = getScreenCoords(dieResult);
    
    if (type === 'blood') {
      bloodPuddles.push({
        x: coords.x, y: coords.y,
        radius: 0, maxRadius: 30 + Math.random() * 20,
        alpha: 0.8
      });
    } else if (type === 'fire') {
      for(let i=0; i<30; i++) {
        particles.push({
          x: coords.x, y: coords.y,
          vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10 - 5,
          life: 1.0, color: `rgba(255, ${Math.random()*150 + 50}, 0, 1)`,
          size: Math.random() * 8 + 4
        });
      }
    } else if (type === 'star') {
      for(let i=0; i<40; i++) {
        particles.push({
          x: coords.x, y: coords.y,
          vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15,
          life: 1.0, color: `rgba(255, 255, 255, 1)`,
          size: Math.random() * 3 + 1,
          isStar: true
        });
      }
    } else if (type === 'saber') {
      particles.push({
        x: coords.x, y: coords.y, vx: 0, vy: 0,
        life: 1.0, color: state.color,
        size: 100, isGlow: true
      });
    }
  }

  function renderVFX() {
    ctx.clearRect(0, 0, vfxCanvas.width, vfxCanvas.height);

    bloodPuddles.forEach(b => {
      if (b.radius < b.maxRadius) b.radius += 1.5;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
      ctx.fillStyle = `rgba(138, 3, 3, ${b.alpha})`;
      ctx.fill();
    });

    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.02;

      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = p.life;
      
      if (p.isGlow) {
        let gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * (2 - p.life));
        gradient.addColorStop(0, p.color);
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (2 - p.life), 0, Math.PI*2);
        ctx.fill();
      } else if (p.isStar) {
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#fff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
    requestAnimationFrame(renderVFX);
  }

  syncUIWithState();
  renderPresets();
  initDiceBox();
  renderVFX();

</script>
</body>
</html>
