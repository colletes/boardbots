<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rolador de Dados 3D — Board Bots Tools</title>
<meta name="description" content="Rolador de dados virtual 3D com física real e efeitos visuais personalizados.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-color: #0b0e12;
  --panel-bg: rgba(24, 29, 37, 0.95);
  --text-main: #eef1f5;
  --text-dim: #9aa4b2;
  --border: #2b323d;
  --blue: #4f8cff;
  --blue-dark: #173a75;
  --red: #d64545;
  --font-display: 'Poppins', 'Segoe UI', sans-serif;
  --font-body: 'Inter', 'Segoe UI', sans-serif;
}

* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  font-family: var(--font-body);
  color: var(--text-main);
  background-color: var(--bg-color);
  background-image: radial-gradient(circle at 50% 50%, #151a22 0%, var(--bg-color) 100%);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* 3D Dice Container */
#dice-box {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  z-index: 10;
}

/* VFX Canvas Overlay */
#vfx-canvas {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  pointer-events: none; z-index: 20;
}

/* UI Sidebar Panel */
.sidebar {
  position: fixed; top: 20px; left: 20px; bottom: 20px; width: 340px;
  background: var(--panel-bg); border: 1px solid var(--border); border-radius: 12px;
  backdrop-filter: blur(10px); z-index: 30;
  display: flex; flex-direction: column;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto; padding: 20px;
}
.sidebar.hidden-ui { transform: translateX(-120%); }

.sidebar-header { margin-bottom: 20px; text-align: center; }
.sidebar-header h1 { margin: 0; font-family: var(--font-display); font-size: 1.5em; color: var(--blue); }
.sidebar-header p { margin: 4px 0 0; color: var(--text-dim); font-size: 0.85em; }

.die-row {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px; margin-bottom: 10px;
}
.die-label { font-weight: 700; font-size: 1.1em; width: 40px; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper-btn {
  width: 30px; height: 30px; border-radius: 50%; border: none;
  background: var(--border); color: #fff; cursor: pointer; font-weight: bold;
}
.stepper-count { width: 24px; text-align: center; font-weight: bold; }
.config-btn {
  background: transparent; border: 1px solid var(--border);
  color: var(--text-dim); padding: 6px; border-radius: 6px; cursor: pointer;
}
.config-btn:hover { color: var(--blue); border-color: var(--blue); }
.config-btn svg { width: 16px; height: 16px; }

.actions-row { display: flex; gap: 10px; margin-top: auto; padding-top: 20px; }
.btn-main, .btn-secondary {
  flex: 1; padding: 14px; border-radius: 8px; font-weight: 700; cursor: pointer;
  border: none; display: flex; justify-content: center; align-items: center; gap: 8px;
}
.btn-main { background: var(--blue); color: #fff; box-shadow: 0 4px 12px rgba(79,140,255,0.3); }
.btn-main:hover { filter: brightness(1.1); }
.btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
.btn-secondary:hover { color: var(--text-main); border-color: var(--text-main); }

/* Config Modal */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 50;
  display: none; justify-content: center; align-items: center;
}
.modal {
  background: var(--panel-bg); border: 1px solid var(--border);
  border-radius: 12px; width: 90%; max-width: 400px; padding: 24px;
}
.modal h2 { margin-top: 0; font-family: var(--font-display); color: var(--text-main); }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; margin-bottom: 6px; color: var(--text-dim); font-size: 0.9em; font-weight: 600; }
.form-control {
  width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--border);
  border-radius: 6px; color: #fff; font-family: var(--font-body);
}
.color-picker-wrap { display: flex; gap: 10px; align-items: center; }
.color-picker { width: 40px; height: 40px; padding: 0; border: none; border-radius: 4px; cursor: pointer; }

/* Result Panel (Center) */
#result-panel {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
  background: var(--panel-bg); border: 1px solid var(--blue);
  box-shadow: 0 0 50px rgba(79,140,255,0.2);
  border-radius: 16px; padding: 30px; width: 90%; max-width: 600px;
  z-index: 40; display: none; opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
#result-panel.show { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
.result-total {
  font-family: var(--font-display); font-size: 4em; font-weight: 800; color: var(--blue);
  text-align: center; line-height: 1; margin-bottom: 20px;
  text-shadow: 0 4px 20px rgba(79,140,255,0.4);
}
.result-grid {
  display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-height: 40vh; overflow-y: auto; padding: 10px;
}
.result-die {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 60px; height: 60px; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  border-radius: 12px; position: relative;
}
.result-die-val { font-size: 1.5em; font-weight: 800; color: #fff; }
.result-die-type { font-size: 0.65em; color: var(--text-dim); text-transform: uppercase; font-weight: 700; }
.close-result-btn {
  margin-top: 24px; width: 100%; padding: 14px; background: transparent; border: 1px solid var(--border);
  color: var(--text-dim); border-radius: 8px; cursor: pointer; font-weight: 600;
}
.close-result-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }

/* Home Button */
.btn-home {
  position: absolute; top: 12px; right: 12px; padding: 8px 12px;
  background: var(--panel-bg); border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 8px; text-decoration: none; font-size: 0.85em; font-weight: 600;
  display: flex; align-items: center; gap: 6px; z-index: 100;
}
.btn-home:hover { color: #fff; border-color: #fff; }

/* Mobile adaptations */
@media (max-width: 600px) {
  .sidebar { width: calc(100% - 40px); top: auto; left: 20px; bottom: 20px; height: 60vh; }
  .sidebar.hidden-ui { transform: translateY(120%); }
  #result-panel { width: 95%; padding: 20px; }
  .result-total { font-size: 3em; }
}
</style>
</head>
<body>

<a href="../index.html" class="btn-home">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
  Voltar
</a>

<div id="dice-box"></div>
<canvas id="vfx-canvas"></canvas>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>Rolador 3D</h1>
    <p>Escolha os dados e efeitos</p>
  </div>
  <div id="dice-list"></div>
  <div class="actions-row">
    <button class="btn-secondary" onclick="clearCounts()">Limpar</button>
    <button class="btn-main" onclick="rollDice()">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      Rolar
    </button>
  </div>
</div>

<div class="modal-overlay" id="config-modal">
  <div class="modal">
    <h2 id="modal-title">Configurar dX</h2>
    <div class="form-group">
      <label>Material / Tema</label>
      <select class="form-control" id="modal-theme">
        <option value="default">Padrão</option>
        <option value="metal">Metálico</option>
        <option value="glass">Vidro Translúcido</option>
        <option value="gemstone">Pedra Preciosa</option>
        <option value="wood">Madeira</option>
        <option value="rust">Enferrujado</option>
      </select>
    </div>
    <div class="form-group">
      <label>Cor Principal</label>
      <div class="color-picker-wrap">
        <input type="color" id="modal-color" class="color-picker">
        <span id="modal-color-hex">#ffffff</span>
      </div>
    </div>
    <div class="form-group">
      <label>Efeito Visual (Impacto)</label>
      <select class="form-control" id="modal-vfx">
        <option value="none">Nenhum</option>
        <option value="fire">🔥 Explosão de Fogo</option>
        <option value="star">✨ Impacto Estelar</option>
        <option value="blood">🩸 Poça de Sangue (Terror)</option>
        <option value="saber">⚔️ Sabre de Luz (Glow)</option>
      </select>
    </div>
    <div class="actions-row" style="margin-top:20px;">
      <button class="btn-secondary" onclick="closeConfigModal()">Cancelar</button>
      <button class="btn-main" onclick="saveDieConfig()">Salvar</button>
    </div>
  </div>
</div>

<div id="result-panel">
  <div class="result-total" id="result-total">0</div>
  <div class="result-grid" id="result-grid"></div>
  <button class="close-result-btn" onclick="closeResults()">Continuar</button>
</div>

<script type="module">
  import DiceBox from 'https://unpkg.com/@3d-dice/dice-box@1.1.3/dist/dice-box.es.min.js';

  const STORAGE_KEY = 'boardbots_dice_3d_v1';
  const DICE_TYPES = [4, 6, 8, 10, 12, 20, 100];
  
  const DEFAULT_CONFIGS = {
    4: { count: 0, theme: 'metal', color: '#a5701c', vfx: 'none' }, 
    6: { count: 0, theme: 'default', color: '#173a75', vfx: 'none' }, 
    8: { count: 0, theme: 'glass', color: '#00ff00', vfx: 'none' }, 
    10: { count: 0, theme: 'metal', color: '#c0c0c0', vfx: 'none' }, 
    12: { count: 0, theme: 'gemstone', color: '#ff00ff', vfx: 'none' }, 
    20: { count: 0, theme: 'default', color: '#d64545', vfx: 'none' }, 
    100: { count: 0, theme: 'wood', color: '#8b4513', vfx: 'none' }
  };

  let state = loadState();
  let currentEditingDie = null;
  let diceBox = null;
  let isRolling = false;
  
  const vfxCanvas = document.getElementById('vfx-canvas');
  const ctx = vfxCanvas.getContext('2d');
  let particles = [];
  let bloodPuddles = [];

  function resizeCanvas() {
    vfxCanvas.width = window.innerWidth;
    vfxCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return JSON.parse(JSON.stringify(DEFAULT_CONFIGS));
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function renderDiceList() {
    const list = document.getElementById('dice-list');
    list.innerHTML = DICE_TYPES.map(type => {
      const d = state[type];
      return `
        <div class="die-row">
          <div class="die-label">d${type}</div>
          <div class="stepper">
            <button class="stepper-btn" onclick="incDie(${type}, -1)">−</button>
            <span class="stepper-count">${d.count}</span>
            <button class="stepper-btn" onclick="incDie(${type}, 1)">+</button>
          </div>
          <button class="config-btn" onclick="openConfigModal(${type})" aria-label="Configurar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"/><path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          </button>
        </div>
      `;
    }).join('');
  }

  window.incDie = function(type, delta) {
    const next = Math.max(0, state[type].count + delta);
    state[type].count = next;
    saveState();
    renderDiceList();
  }

  window.clearCounts = function() {
    DICE_TYPES.forEach(type => state[type].count = 0);
    saveState();
    renderDiceList();
  }

  window.openConfigModal = function(type) {
    currentEditingDie = type;
    const d = state[type];
    document.getElementById('modal-title').textContent = `Configurar d${type}`;
    document.getElementById('modal-theme').value = d.theme;
    document.getElementById('modal-color').value = d.color;
    document.getElementById('modal-color-hex').textContent = d.color;
    document.getElementById('modal-vfx').value = d.vfx;
    document.getElementById('config-modal').style.display = 'flex';
  }

  window.closeConfigModal = function() {
    document.getElementById('config-modal').style.display = 'none';
  }

  document.getElementById('modal-color').addEventListener('input', (e) => {
    document.getElementById('modal-color-hex').textContent = e.target.value;
  });

  window.saveDieConfig = function() {
    if(!currentEditingDie) return;
    state[currentEditingDie].theme = document.getElementById('modal-theme').value;
    state[currentEditingDie].color = document.getElementById('modal-color').value;
    state[currentEditingDie].vfx = document.getElementById('modal-vfx').value;
    saveState();
    closeConfigModal();
  }

  async function initDiceBox() {
    diceBox = new DiceBox("#dice-box", {
      assetPath: 'https://unpkg.com/@3d-dice/dice-box@1.1.3/dist/assets/',
      theme: 'default',
      themeColor: '#4f8cff',
      scale: 7, 
      gravity: 2.5,
      friction: 0.8,
      restitution: 0.5,
      spinForce: 8,
      throwForce: 6
    });

    await diceBox.init();
    
    diceBox.onDieComplete = (dieResult) => {
      const dieData = state[dieResult.sides];
      if (dieData && dieData.vfx !== 'none') {
        spawnVFX(dieData.vfx, dieResult);
      }
    };

    diceBox.onRollComplete = (results) => {
      isRolling = false;
      setTimeout(() => showResultsModal(results), 800);
    };
  }

  function getScreenCoords(dieResult) {
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    const rx = (Math.random() - 0.5) * (window.innerWidth * 0.6);
    const ry = (Math.random() - 0.5) * (window.innerHeight * 0.6);
    return { x: cx + rx, y: cy + ry }; 
  }

  window.rollDice = function() {
    if (isRolling || !diceBox) return;
    
    let rollNotation = [];
    DICE_TYPES.forEach(type => {
      if (state[type].count > 0) {
        // Usa a notação de string padrão da biblioteca para evitar erros com propriedades customizadas
        rollNotation.push(`${state[type].count}d${type}`);
      }
    });

    if (rollNotation.length === 0) {
      alert("Selecione ao menos um dado!");
      return;
    }

    document.getElementById('sidebar').classList.add('hidden-ui');
    document.getElementById('result-panel').classList.remove('show');
    
    particles = [];
    bloodPuddles = [];
    ctx.clearRect(0, 0, vfxCanvas.width, vfxCanvas.height);

    isRolling = true;
    diceBox.clear();
    diceBox.roll(rollNotation).catch(e => {
        console.error("Erro no roll:", e);
        isRolling = false;
        document.getElementById('sidebar').classList.remove('hidden-ui');
    });
  }

  function showResultsModal(results) {
    let total = 0;
    let flatResults = [];
    
    let arr = Array.isArray(results) ? results : [results];
    arr.forEach(group => {
      if (group.rolls) {
        group.rolls.forEach(r => {
          total += r.value;
          flatResults.push({ type: group.sides || group.dieType, val: r.value });
        });
      } else if (group.value) {
          total += group.value;
          flatResults.push({ type: group.sides, val: group.value });
      }
    });

    flatResults.sort((a, b) => {
      let tA = parseInt(String(a.type).replace(/\\D/g, '')) || 0;
      let tB = parseInt(String(b.type).replace(/\\D/g, '')) || 0;
      if (tA !== tB) return tA - tB;
      return a.val - b.val;
    });

    document.getElementById('result-total').textContent = total;
    document.getElementById('result-grid').innerHTML = flatResults.map(r => `
      <div class="result-die">
        <span class="result-die-val">${r.val}</span>
        <span class="result-die-type">d${r.type}</span>
      </div>
    `).join('');

    diceBox.clear(); 
    document.getElementById('result-panel').classList.add('show');
  }

  window.closeResults = function() {
    document.getElementById('result-panel').classList.remove('show');
    document.getElementById('sidebar').classList.remove('hidden-ui');
  }
  
  function spawnVFX(type, dieResult) {
    const coords = getScreenCoords(dieResult);
    
    if (type === 'blood') {
      bloodPuddles.push({
        x: coords.x, y: coords.y,
        radius: 0, maxRadius: 30 + Math.random() * 20,
        alpha: 0.8
      });
    } else if (type === 'fire') {
      for(let i=0; i<30; i++) {
        particles.push({
          x: coords.x, y: coords.y,
          vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10 - 5,
          life: 1.0, color: `rgba(255, ${Math.random()*150 + 50}, 0, 1)`,
          size: Math.random() * 8 + 4
        });
      }
    } else if (type === 'star') {
      for(let i=0; i<40; i++) {
        particles.push({
          x: coords.x, y: coords.y,
          vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15,
          life: 1.0, color: `rgba(255, 255, 255, 1)`,
          size: Math.random() * 3 + 1,
          isStar: true
        });
      }
    } else if (type === 'saber') {
      particles.push({
        x: coords.x, y: coords.y, vx: 0, vy: 0,
        life: 1.0, color: state[dieResult.sides].color,
        size: 100, isGlow: true
      });
    }
  }

  function renderVFX() {
    ctx.clearRect(0, 0, vfxCanvas.width, vfxCanvas.height);

    bloodPuddles.forEach(b => {
      if (b.radius < b.maxRadius) b.radius += 1.5;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
      ctx.fillStyle = `rgba(138, 3, 3, ${b.alpha})`;
      ctx.fill();
    });

    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.02;

      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = p.life;
      
      if (p.isGlow) {
        let gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * (2 - p.life));
        gradient.addColorStop(0, p.color);
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (2 - p.life), 0, Math.PI*2);
        ctx.fill();
      } else if (p.isStar) {
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#fff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
    requestAnimationFrame(renderVFX);
  }

  renderDiceList();
  initDiceBox();
  renderVFX();

</script>
</body>
</html>
