<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rolador de Dados 3D — Board Bots Tools</title>
<meta name="description" content="Rolador de dados virtual 3D com física real e efeitos visuais personalizados.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;800&family=Bangers&display=swap" rel="stylesheet">

<style>
:root {
  --bg-color: #0b0e12;
  --panel-bg: rgba(24, 29, 37, 0.95);
  --text-main: #eef1f5;
  --text-dim: #9aa4b2;
  --border: #2b323d;
  --blue: #4f8cff;
  --blue-dark: #173a75;
  --red: #d64545;
  --font-display: 'Poppins', 'Segoe UI', sans-serif;
  --font-body: 'Inter', 'Segoe UI', sans-serif;
  --number-color: #ffffff;
  --number-font: 'Poppins', 'Segoe UI', sans-serif;
}

* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  font-family: var(--font-body);
  color: var(--text-main);
  background-color: var(--bg-color);
  background-image: radial-gradient(circle at 50% 50%, #151a22 0%, var(--bg-color) 100%);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

#dice-box {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100vw; height: 100vh;
  z-index: 10;
}
#dice-box canvas {
  width: 100% !important; height: 100% !important;
  display: block;
}

#vfx-canvas {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  pointer-events: none; z-index: 20;
}

.sidebar {
  position: fixed; top: 20px; left: 20px; bottom: 20px; width: 340px;
  background: var(--panel-bg); border: 1px solid var(--border); border-radius: 12px;
  backdrop-filter: blur(10px); z-index: 30;
  display: flex; flex-direction: column;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto; padding: 20px;
}
.sidebar.hidden-ui { transform: translateX(-120%); }
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.sidebar-header { margin-bottom: 15px; text-align: center; }
.sidebar-header h1 { margin: 0; font-family: var(--font-display); font-size: 1.5em; color: var(--blue); }
.sidebar-header p { margin: 4px 0 0; color: var(--text-dim); font-size: 0.85em; }

.section-title { font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin: 15px 0 10px; font-weight: 700; }

.die-row {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px; margin-bottom: 8px;
}
.die-label { font-weight: 700; font-size: 1.1em; width: 40px; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper-btn {
  width: 28px; height: 28px; border-radius: 50%; border: none;
  background: var(--border); color: #fff; cursor: pointer; font-weight: bold;
}
.stepper-count { width: 24px; text-align: center; font-weight: bold; }

.form-group { margin-bottom: 12px; }
.form-group label { display: block; margin-bottom: 6px; color: var(--text-dim); font-size: 0.85em; font-weight: 600; }
.form-control {
  width: 100%; padding: 8px; background: rgba(0,0,0,0.2); border: 1px solid var(--border);
  border-radius: 6px; color: #fff; font-family: var(--font-body); font-size: 0.9em;
}
.color-picker-wrap { display: flex; gap: 10px; align-items: center; }
.color-picker { width: 36px; height: 36px; padding: 0; border: none; border-radius: 4px; cursor: pointer; }

.preset-row { display: flex; gap: 8px; margin-bottom: 15px; }
.preset-row select { flex: 1; }
.btn-icon {
  background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  color: var(--text-dim); border-radius: 6px; padding: 0 10px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.btn-icon:hover { color: #fff; border-color: #fff; }

.actions-row { display: flex; gap: 10px; margin-top: 20px; }
.btn-main, .btn-secondary {
  flex: 1; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer;
  border: none; display: flex; justify-content: center; align-items: center; gap: 8px;
}
.btn-main { background: var(--blue); color: #fff; box-shadow: 0 4px 12px rgba(79,140,255,0.3); }
.btn-main:hover { filter: brightness(1.1); }
.btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
.btn-secondary:hover { color: var(--text-main); border-color: var(--text-main); }

#result-panel {
  position: fixed; bottom: 30px; top: auto; left: 50%; transform: translate(-50%, 20px) scale(0.9);
  background: rgba(24, 29, 37, 0.85); border: 1px solid var(--blue);
  box-shadow: 0 10px 40px rgba(79,140,255,0.2); backdrop-filter: blur(8px);
  border-radius: 16px; padding: 20px; width: 90%; max-width: 500px;
  z-index: 40; display: none; opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
#result-panel.show { display: block; opacity: 1; transform: translate(-50%, 0) scale(1); }
.result-total {
  font-family: var(--number-font); font-size: 4em; font-weight: 800; color: var(--number-color);
  text-align: center; line-height: 1; margin-bottom: 20px;
  text-shadow: 0 4px 20px color-mix(in srgb, var(--number-color) 45%, transparent);
}
.result-grid {
  display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-height: 40vh; overflow-y: auto; padding: 10px;
}
.result-die {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 60px; height: 60px; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  border-radius: 12px; position: relative;
}
.result-die-val { font-size: 1.5em; font-weight: 800; color: var(--number-color); font-family: var(--number-font); }
.result-die-type { font-size: 0.65em; color: var(--text-dim); text-transform: uppercase; font-weight: 700; }
.close-result-btn {
  margin-top: 24px; width: 100%; padding: 14px; background: transparent; border: 1px solid var(--border);
  color: var(--text-dim); border-radius: 8px; cursor: pointer; font-weight: 600;
}
.close-result-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }

.btn-home {
  position: absolute; top: 12px; right: 12px; padding: 8px 12px;
  background: var(--panel-bg); border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 8px; text-decoration: none; font-size: 0.85em; font-weight: 600;
  display: flex; align-items: center; gap: 6px; z-index: 100;
}
.btn-home:hover { color: #fff; border-color: #fff; }

.lang-switch {
  position: fixed; bottom: 20px; right: 20px; z-index: 50;
  display: flex; gap: 4px; background: var(--panel-bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 4px; backdrop-filter: blur(10px);
}
.lang-btn {
  background: transparent; border: none; color: var(--text-dim); padding: 6px 10px;
  border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.8em; font-family: var(--font-body);
}
.lang-btn.active { background: var(--blue); color: #fff; }

@media (max-width: 600px) {
  .sidebar { width: calc(100% - 40px); top: auto; left: 20px; bottom: 20px; height: 75vh; }
  .sidebar.hidden-ui { transform: translateY(120%); }
  #result-panel { width: 95%; padding: 20px; }
  .result-total { font-size: 3em; }
  .lang-switch { bottom: auto; top: 12px; right: 90px; }
}
</style>
</head>
<body>

<a href="../index.html" class="btn-home">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
  <span data-i18n="backBtn">Voltar</span>
</a>

<div class="lang-switch">
  <button class="lang-btn" id="lang-pt" onclick="setLang('pt')">PT-BR</button>
  <button class="lang-btn" id="lang-en" onclick="setLang('en')">EN</button>
</div>

<div id="dice-box"></div>
<canvas id="vfx-canvas"></canvas>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1 data-i18n="title">Rolador 3D</h1>
    <p data-i18n="subtitle">Configure sua mesa</p>
  </div>

  <div class="section-title" data-i18n="presetsTitle">Presets</div>
  <div class="preset-row">
    <select class="form-control" id="preset-selector" onchange="loadPreset(this.value)">
      <option value="" data-i18n="presetPlaceholder">-- Escolha um Preset --</option>
    </select>
    <button class="btn-icon" onclick="savePreset()" data-i18n-title="savePresetTitle" title="Salvar Preset Atual">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    </button>
    <button class="btn-icon" onclick="deletePreset()" data-i18n-title="deletePresetTitle" title="Excluir Preset" style="color: var(--red);">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
    </button>
  </div>

  <div class="section-title" data-i18n="styleSectionTitle">Estilo Global</div>
  <div class="form-group">
    <label data-i18n="materialLabel">Material / Tema</label>
    <select class="form-control" id="global-theme" onchange="updateGlobalConfig()">
      <option value="default" data-i18n="themeDefault">🎲 Plástico (Padrão)</option>
      <option value="blueGreenMetal" data-i18n="themeMetal">⚙️ Metálico</option>
      <option value="rust" data-i18n="themeRust">🔩 Aço Escovado / Enferrujado</option>
      <option value="gemstone" data-i18n="themeGlass">💎 Vidro (Gema)</option>
      <option value="gemstoneMarble" data-i18n="themeMarble">🌈 Mármore</option>
      <option value="smooth" data-i18n="themeMatte">◻️ Fosco (Matte)</option>
      <option value="wooden" data-i18n="themeWood">🪵 Madeira</option>
      <option value="diceOfRolling" data-i18n="themeDiceOfRolling">⚔️ Aventureiro (Dice of Rolling)</option>
      <option value="rock" data-i18n="themeRock">🪨 Pedra (Rock)</option>
      <option value="smoothPip" data-i18n="themeSmoothPip">🎲 Clássico de Pontinhos (Pips)</option>
    </select>
  </div>
  <div class="form-group">
    <label data-i18n="colorLabel">Cor Principal</label>
    <div class="color-picker-wrap">
      <input type="color" id="global-color" class="color-picker" onchange="updateGlobalConfig()">
      <span id="global-color-hex" style="font-size: 0.85em; color: var(--text-dim);">#ffffff</span>
    </div>
    <small id="color-note" data-i18n="colorNote" style="display:none; margin-top:6px; color: var(--text-dim); font-size: 0.75em;">Esta textura já tem cor/padrão próprio — a cor escolhida não se aplica.</small>
  </div>
  <div class="form-group">
    <label data-i18n="numberColorLabel">Cor dos Números (Apenas UI)</label>
    <div class="color-picker-wrap">
      <input type="color" id="global-number-color" class="color-picker" onchange="updateGlobalConfig()">
      <span id="global-number-color-hex" style="font-size: 0.85em; color: var(--text-dim);">#ffffff</span>
    </div>
  </div>
  <div class="form-group">
    <label data-i18n="numberFontLabel">Fonte dos Números (Apenas UI)</label>
    <select class="form-control" id="global-number-font" onchange="updateGlobalConfig()">
      <option value="'Poppins', 'Segoe UI', sans-serif" data-i18n="fontDefault">Poppins (Padrão)</option>
      <option value="'Inter', 'Segoe UI', sans-serif" data-i18n="fontInter">Inter</option>
      <option value="'Orbitron', sans-serif" data-i18n="fontOrbitron">Orbitron (Futurista)</option>
      <option value="'Bangers', cursive" data-i18n="fontBangers">Bangers (Cômico)</option>
      <option value="'Courier New', monospace" data-i18n="fontMono">Courier (Retrô)</option>
    </select>
    <small style="display:block; margin-top:6px; color: var(--text-dim); font-size: 0.75em;" data-i18n="fontNote">A cor e a fonte nos dados 3D vêm embutidas na textura e não podem ser alteradas. Essas opções mudam apenas a interface de resultados.</small>
  </div>
  <div class="form-group">
    <label data-i18n="vfxLabel">Efeito Visual (Impacto)</label>
    <select class="form-control" id="global-vfx" onchange="updateGlobalConfig()">
      <option value="none" data-i18n="vfxNone">Nenhum</option>
      <option value="fire" data-i18n="vfxFire">🔥 Explosão de Fogo</option>
      <option value="star" data-i18n="vfxStar">✨ Impacto Estelar</option>
      <option value="blood" data-i18n="vfxBlood">🩸 Respingo de Sangue (Terror)</option>
      <option value="saber" data-i18n="vfxSaber">⚔️ Sabre de Luz (Glow)</option>
      <option value="trail" data-i18n="vfxTrail">💫 Trilha Cometa</option>
    </select>
  </div>
  <div class="form-group">
    <label data-i18n="sfxLabel">Efeito Sonoro</label>
    <select class="form-control" id="global-sfx" onchange="updateGlobalConfig()">
      <option value="none" data-i18n="vfxNone">Nenhum</option>
      <option value="robot" data-i18n="sfxRobot">🤖 Robótico</option>
    </select>
  </div>

  <div class="section-title" data-i18n="diceSectionTitle">Dados</div>
  <div id="dice-list"></div>
  
  <div class="actions-row">
    <button class="btn-secondary" onclick="clearCounts()" data-i18n="clearBtn">Limpar</button>
    <button class="btn-main" onclick="rollDice()">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      <span data-i18n="rollBtn">Rolar</span>
    </button>
  </div>
</div>

<div id="result-panel">
  <div class="result-total" id="result-total">0</div>
  <div class="result-grid" id="result-grid"></div>
  <button class="close-result-btn" onclick="closeResults()" data-i18n="continueBtn">Continuar</button>
</div>

<script type="module">
  import DiceBox from 'https://unpkg.com/@3d-dice/dice-box@1.1.3/dist/dice-box.es.min.js';

  const STORAGE_KEY = 'boardbots_dice_3d_v2';
  const PRESETS_KEY = 'boardbots_dice_presets_v2';
  const DICE_TYPES = [4, 6, 8, 10, 12, 20, 100];
  
  const DEFAULT_STATE = {
    counts: { 4:0, 6:0, 8:0, 10:0, 12:0, 20:0, 100:0 },
    theme: 'default',
    color: '#4f8cff',
    vfx: 'none',
    sfx: 'none',
    numberColor: '#ffffff',
    numberFont: "'Poppins', 'Segoe UI', sans-serif"
  };

  // Real theme asset folders published in the @3d-dice/dice-themes CDN package.
  // dice-box's own CDN bundle only ships the "default" theme, so every other
  // material must be loaded from this external package via externalThemes.
  const DICE_THEMES_CDN = 'https://unpkg.com/@3d-dice/dice-themes@0.2.1/themes';
  const EXTERNAL_THEMES = {
    blueGreenMetal: `${DICE_THEMES_CDN}/blueGreenMetal`,
    rust: `${DICE_THEMES_CDN}/rust`,
    gemstone: `${DICE_THEMES_CDN}/gemstone`,
    gemstoneMarble: `${DICE_THEMES_CDN}/gemstoneMarble`,
    smooth: `${DICE_THEMES_CDN}/smooth`,
    wooden: `${DICE_THEMES_CDN}/wooden`,
    diceOfRolling: `${DICE_THEMES_CDN}/diceOfRolling`,
    rock: `${DICE_THEMES_CDN}/rock`,
    smoothPip: `${DICE_THEMES_CDN}/smooth-pip`
  };
  // Themes whose material is a fixed texture ("standard" type) ignore themeColor.
  const NON_RECOLORABLE_THEMES = ['blueGreenMetal', 'gemstoneMarble', 'wooden'];
  // Legacy theme values saved before this update no longer point anywhere valid.
  const THEME_MIGRATION = { wood: 'wooden' };

  const LANG_KEY = 'boardbots_dice_lang';
  const I18N = {
    pt: {
      pageTitle: 'Rolador de Dados 3D — Board Bots Tools',
      metaDescription: 'Rolador de dados virtual 3D com física real e efeitos visuais personalizados.',
      backBtn: 'Voltar',
      title: 'Rolador 3D',
      subtitle: 'Configure sua mesa',
      presetsTitle: 'Presets',
      presetPlaceholder: '-- Escolha um Preset --',
      savePresetTitle: 'Salvar Preset Atual',
      deletePresetTitle: 'Excluir Preset',
      styleSectionTitle: 'Estilo Global',
      materialLabel: 'Material / Tema',
      themeDefault: '🎲 Plástico (Padrão)',
      themeMetal: '⚙️ Metálico',
      themeRust: '🔩 Aço Escovado / Enferrujado',
      themeGlass: '💎 Vidro (Gema)',
      themeMarble: '🌈 Mármore',
      themeMatte: '◻️ Fosco (Matte)',
      themeWood: '🪵 Madeira',
      themeDiceOfRolling: '⚔️ Aventureiro (Dice of Rolling)',
      themeRock: '🪨 Pedra',
      themeSmoothPip: '🎲 Clássico de Pontinhos',
      colorLabel: 'Cor Principal',
      colorNote: 'Esta textura já tem cor/padrão próprio — a cor escolhida não se aplica.',
      numberColorLabel: 'Cor dos Números (Apenas UI)',
      numberFontLabel: 'Fonte dos Números (Apenas UI)',
      fontNote: 'A cor e a fonte nos dados 3D vêm embutidas na textura e não podem ser alteradas. Essas opções mudam apenas a interface de resultados.',
      fontDefault: 'Poppins (Padrão)',
      fontInter: 'Inter',
      fontOrbitron: 'Orbitron (Futurista)',
      fontBangers: 'Bangers (Cômico)',
      fontMono: 'Courier (Retrô)',
      vfxLabel: 'Efeito Visual (Impacto)',
      vfxNone: 'Nenhum',
      vfxFire: '🔥 Explosão de Fogo',
      vfxStar: '✨ Impacto Estelar',
      vfxBlood: '🩸 Respingo de Sangue (Terror)',
      vfxSaber: '⚔️ Sabre de Luz (Glow)',
      vfxTrail: '💫 Trilha Cometa',
      sfxLabel: 'Efeito Sonoro',
      sfxRobot: '🤖 Robótico',
      diceSectionTitle: 'Dados',
      clearBtn: 'Limpar',
      rollBtn: 'Rolar',
      continueBtn: 'Continuar',
      promptPresetName: 'Nome do preset:',
      confirmDeletePreset: (name) => `Excluir o preset "${name}"?`,
      alertNoDice: 'Selecione ao menos um dado!'
    },
    en: {
      pageTitle: '3D Dice Roller — Board Bots Tools',
      metaDescription: 'Virtual 3D dice roller with real physics and custom visual effects.',
      backBtn: 'Back',
      title: '3D Roller',
      subtitle: 'Set up your table',
      presetsTitle: 'Presets',
      presetPlaceholder: '-- Choose a Preset --',
      savePresetTitle: 'Save Current Preset',
      deletePresetTitle: 'Delete Preset',
      styleSectionTitle: 'Global Style',
      materialLabel: 'Material / Theme',
      themeDefault: '🎲 Plastic (Default)',
      themeMetal: '⚙️ Metallic',
      themeRust: '🔩 Brushed Steel / Rusted',
      themeGlass: '💎 Glass (Gem)',
      themeMarble: '🌈 Marble',
      themeMatte: '◻️ Matte',
      themeWood: '🪵 Wood',
      themeDiceOfRolling: '⚔️ Adventurer (Dice of Rolling)',
      themeRock: '🪨 Rock',
      themeSmoothPip: '🎲 Classic Pips',
      colorLabel: 'Main Color',
      colorNote: "This texture already has its own color/pattern — the chosen color won't apply.",
      numberColorLabel: 'Number Color (UI Only)',
      numberFontLabel: 'Number Font (UI Only)',
      fontNote: 'The color and font on the 3D dice are baked into the texture and cannot be changed. These options only affect the UI results.',
      fontDefault: 'Poppins (Default)',
      fontInter: 'Inter',
      fontOrbitron: 'Orbitron (Futuristic)',
      fontBangers: 'Bangers (Comic)',
      fontMono: 'Courier (Retro)',
      vfxLabel: 'Visual Effect (Impact)',
      vfxNone: 'None',
      vfxFire: '🔥 Fire Explosion',
      vfxStar: '✨ Star Impact',
      vfxBlood: '🩸 Blood Splatter (Horror)',
      vfxSaber: '⚔️ Lightsaber (Glow)',
      vfxTrail: '💫 Comet Trail',
      sfxLabel: 'Sound Effect',
      sfxRobot: '🤖 Robotic',
      diceSectionTitle: 'Dice',
      clearBtn: 'Clear',
      rollBtn: 'Roll',
      continueBtn: 'Continue',
      promptPresetName: 'Preset name:',
      confirmDeletePreset: (name) => `Delete preset "${name}"?`,
      alertNoDice: 'Select at least one die!'
    }
  };
  let currentLang = localStorage.getItem(LANG_KEY) || 'pt';
  function S() { return I18N[currentLang]; }

  function applyI18n() {
    document.documentElement.lang = currentLang === 'pt' ? 'pt-BR' : 'en';
    document.title = S().pageTitle;
    const metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.content = S().metaDescription;

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if (S()[key] !== undefined) el.textContent = S()[key];
    });
    document.querySelectorAll('[data-i18n-title]').forEach(el => {
      const key = el.dataset.i18nTitle;
      if (S()[key] !== undefined) el.title = S()[key];
    });

    document.getElementById('lang-pt').classList.toggle('active', currentLang === 'pt');
    document.getElementById('lang-en').classList.toggle('active', currentLang === 'en');
  }

  window.setLang = function(lang) {
    currentLang = lang;
    localStorage.setItem(LANG_KEY, lang);
    applyI18n();
    renderPresets();
    renderDiceList();
  }

  let state = loadState();
  let presets = loadPresets();
  let diceBox = null;
  let isRolling = false;
  
  const vfxCanvas = document.getElementById('vfx-canvas');
  const ctx = vfxCanvas.getContext('2d');
  let particles = [];
  let bloodPuddles = [];

  function resizeCanvas() {
    vfxCanvas.width = window.innerWidth;
    vfxCanvas.height = window.innerHeight;
  }

  // Dice-box sizes its dice as a fixed multiple of the container regardless of
  // viewport size, so on large/wide screens dice can look tiny relative to the
  // available table area. Scale up with viewport size and shrink a bit as more
  // dice are added so a big roll still fits comfortably on screen.
  function totalDiceCount() {
    return DICE_TYPES.reduce((sum, type) => sum + (state.counts[type] || 0), 0);
  }

  function computeAdaptiveScale() {
    const minDim = Math.min(window.innerWidth, window.innerHeight);
    let scale = 7 * (minDim / 900);
    const count = Math.max(1, totalDiceCount());
    if (count > 4) scale *= Math.pow(4 / count, 0.25);
    return Math.min(11, Math.max(3, scale));
  }

  let resizeDebounceTimer = null;
  window.addEventListener('resize', () => {
    resizeCanvas();
    clearTimeout(resizeDebounceTimer);
    resizeDebounceTimer = setTimeout(() => {
      if (diceBox && !isRolling) {
        diceBox.updateConfig({ scale: computeAdaptiveScale() });
      }
    }, 200);
  });
  resizeCanvas();

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (THEME_MIGRATION[parsed.theme]) parsed.theme = THEME_MIGRATION[parsed.theme];
        if (!parsed.sfx) parsed.sfx = 'none';
        if (!parsed.numberColor) parsed.numberColor = DEFAULT_STATE.numberColor;
        if (!parsed.numberFont) parsed.numberFont = DEFAULT_STATE.numberFont;
        return parsed;
      }
    } catch(e) {}
    return JSON.parse(JSON.stringify(DEFAULT_STATE));
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function loadPresets() {
    try {
      const raw = localStorage.getItem(PRESETS_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return {};
  }

  function savePresets() {
    localStorage.setItem(PRESETS_KEY, JSON.stringify(presets));
  }

  function renderPresets() {
    const sel = document.getElementById('preset-selector');
    sel.innerHTML = `<option value="">${S().presetPlaceholder}</option>`;
    for (const name in presets) {
      sel.innerHTML += `<option value="${name}">${name}</option>`;
    }
  }

  window.savePreset = function() {
    const name = prompt(S().promptPresetName);
    if (!name || name.trim() === '') return;
    presets[name.trim()] = JSON.parse(JSON.stringify(state));
    savePresets();
    renderPresets();
    document.getElementById('preset-selector').value = name.trim();
  }

  window.loadPreset = function(name) {
    if (!name || !presets[name]) return;
    state = JSON.parse(JSON.stringify(presets[name]));
    if (!state.sfx) state.sfx = 'none';
    if (!state.numberColor) state.numberColor = DEFAULT_STATE.numberColor;
    if (!state.numberFont) state.numberFont = DEFAULT_STATE.numberFont;
    saveState();
    syncUIWithState();
    if (diceBox) {
      diceBox.updateConfig({ theme: state.theme, themeColor: state.color });
    }
  }

  window.deletePreset = function() {
    const sel = document.getElementById('preset-selector');
    const name = sel.value;
    if (!name || !presets[name]) return;
    if (confirm(S().confirmDeletePreset(name))) {
      delete presets[name];
      savePresets();
      renderPresets();
      sel.value = "";
    }
  }

  function updateColorPickerAvailability() {
    const disabled = NON_RECOLORABLE_THEMES.includes(state.theme);
    const colorInput = document.getElementById('global-color');
    colorInput.disabled = disabled;
    colorInput.parentElement.style.opacity = disabled ? '0.4' : '1';
    document.getElementById('color-note').style.display = disabled ? 'block' : 'none';
  }

  function applyNumberStyle() {
    document.documentElement.style.setProperty('--number-color', state.numberColor);
    document.documentElement.style.setProperty('--number-font', state.numberFont);
  }

  function syncUIWithState() {
    document.getElementById('global-theme').value = state.theme;
    document.getElementById('global-color').value = state.color;
    document.getElementById('global-color-hex').textContent = state.color;
    document.getElementById('global-number-color').value = state.numberColor;
    document.getElementById('global-number-color-hex').textContent = state.numberColor;
    document.getElementById('global-number-font').value = state.numberFont;
    document.getElementById('global-vfx').value = state.vfx;
    document.getElementById('global-sfx').value = state.sfx || 'none';
    updateColorPickerAvailability();
    applyNumberStyle();
    applyI18n();
    renderDiceList();
  }

  window.updateGlobalConfig = function() {
    state.theme = document.getElementById('global-theme').value;
    state.color = document.getElementById('global-color').value;
    document.getElementById('global-color-hex').textContent = state.color;
    state.numberColor = document.getElementById('global-number-color').value;
    document.getElementById('global-number-color-hex').textContent = state.numberColor;
    state.numberFont = document.getElementById('global-number-font').value;
    state.vfx = document.getElementById('global-vfx').value;
    state.sfx = document.getElementById('global-sfx').value;
    saveState();
    updateColorPickerAvailability();
    applyNumberStyle();

    if (diceBox) {
      diceBox.updateConfig({
        theme: state.theme,
        themeColor: state.color
      });
    }
  }

  function renderDiceList() {
    const list = document.getElementById('dice-list');
    list.innerHTML = DICE_TYPES.map(type => {
      const count = state.counts[type] || 0;
      return `
        <div class="die-row">
          <div class="die-label">d${type}</div>
          <div class="stepper">
            <button class="stepper-btn" onclick="incDie(${type}, -1)">−</button>
            <span class="stepper-count">${count}</span>
            <button class="stepper-btn" onclick="incDie(${type}, 1)">+</button>
          </div>
        </div>
      `;
    }).join('');
  }

  window.incDie = function(type, delta) {
    const current = state.counts[type] || 0;
    state.counts[type] = Math.max(0, current + delta);
    saveState();
    renderDiceList();
  }

  window.clearCounts = function() {
    DICE_TYPES.forEach(type => state.counts[type] = 0);
    saveState();
    renderDiceList();
  }

  async function initDiceBox() {
    diceBox = new DiceBox({
      container: "#dice-box",
      assetPath: 'assets/',
      origin: 'https://unpkg.com/@3d-dice/dice-box@1.1.3/dist/',
      externalThemes: EXTERNAL_THEMES,
      theme: state.theme,
      themeColor: state.color,
      scale: computeAdaptiveScale(), 
      gravity: 2.5,
      friction: 0.8,
      restitution: 0.5,
      spinForce: 8,
      throwForce: 6
    });

    await diceBox.init();
    setTimeout(() => window.dispatchEvent(new Event('resize')), 100);
    
    diceBox.onDieComplete = (dieResult) => {
      if (state.vfx !== 'none') {
        spawnVFX(state.vfx, dieResult);
      }
      if (state.sfx === 'robot') {
        playRobotBlip();
      }
    };

    diceBox.onRollComplete = (results) => {
      isRolling = false;
      setTimeout(() => showResultsModal(results), 800);
    };
  }

  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  // Procedurally synthesized "robot" sounds via Web Audio API oscillators
  // (no external audio files needed, keeps this a single self-contained file).
  function playRobotBlip() {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    const startFreq = 260 + Math.random() * 520;
    osc.frequency.setValueAtTime(startFreq, now);
    osc.frequency.exponentialRampToValueAtTime(startFreq * (Math.random() > 0.5 ? 2.4 : 0.42), now + 0.09);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.16, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.13);
  }

  function playRobotActivate() {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    for (let i = 0; i < 3; i++) {
      const t0 = now + i * 0.07;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140 + i * 240, t0);
      gain.gain.setValueAtTime(0.001, t0);
      gain.gain.exponentialRampToValueAtTime(0.14, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.1);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.11);
    }
  }

  function getScreenCoords(dieResult) {
    // The Web Worker physics engine doesn't export 3D/2D coordinates for the dice result.
    // We will spawn VFX near the center of the screen with a slight variation.
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    const rx = (Math.random() - 0.5) * 80;
    const ry = (Math.random() - 0.5) * 80;
    return { x: cx + rx, y: cy + ry }; 
  }

  window.rollDice = function() {
    if (isRolling || !diceBox) return;
    
    let rollNotation = [];
    DICE_TYPES.forEach(type => {
      const count = state.counts[type] || 0;
      if (count > 0) {
        rollNotation.push(`${count}d${type}`);
      }
    });

    if (rollNotation.length === 0) {
      alert(S().alertNoDice);
      return;
    }

    document.getElementById('sidebar').classList.add('hidden-ui');
    document.getElementById('result-panel').classList.remove('show');
    
    particles = [];
    bloodPuddles = [];
    ctx.clearRect(0, 0, vfxCanvas.width, vfxCanvas.height);

    if (state.sfx === 'robot') {
      playRobotActivate();
    }

    isRolling = true;
    diceBox.updateConfig({ scale: computeAdaptiveScale() });
    diceBox.clear();
    diceBox.roll(rollNotation).catch(e => {
        console.error("Erro no roll:", e);
        isRolling = false;
        document.getElementById('sidebar').classList.remove('hidden-ui');
    });
  }

  function showResultsModal(results) {
    let total = 0;
    let flatResults = [];
    
    let arr = Array.isArray(results) ? results : [results];
    arr.forEach(group => {
      if (group.rolls) {
        group.rolls.forEach(r => {
          total += r.value;
          flatResults.push({ type: group.sides || group.dieType, val: r.value });
        });
      } else if (group.value) {
          total += group.value;
          flatResults.push({ type: group.sides, val: group.value });
      }
    });

    flatResults.sort((a, b) => {
      let tA = parseInt(String(a.type).replace(/\D/g, '')) || 0;
      let tB = parseInt(String(b.type).replace(/\D/g, '')) || 0;
      if (tA !== tB) return tA - tB;
      return a.val - b.val;
    });

    document.getElementById('result-total').textContent = total;
    document.getElementById('result-grid').innerHTML = flatResults.map(r => `
      <div class="result-die">
        <span class="result-die-val">${r.val}</span>
        <span class="result-die-type">d${r.type}</span>
      </div>
    `).join('');

    document.getElementById('result-panel').classList.add('show');
  }

  window.closeResults = function() {
    document.getElementById('result-panel').classList.remove('show');
    document.getElementById('sidebar').classList.remove('hidden-ui');
    if (diceBox) diceBox.clear();
  }
  
  function spawnVFX(type, dieResult) {
    const coords = getScreenCoords(dieResult);
    
    if (type === 'blood') {
      bloodPuddles.push({
        x: coords.x, y: coords.y,
        radius: 0, maxRadius: 34 + Math.random() * 22,
        alpha: 0.82
      });
      // Radial spatter droplets around the main puddle for a deluxe "splatter" look.
      const dropCount = 6 + Math.floor(Math.random() * 5);
      for (let i = 0; i < dropCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 14 + Math.random() * 70;
        bloodPuddles.push({
          x: coords.x + Math.cos(angle) * dist,
          y: coords.y + Math.sin(angle) * dist * 0.6,
          radius: 0, maxRadius: 3 + Math.random() * 9,
          alpha: 0.5 + Math.random() * 0.3
        });
      }
    } else if (type === 'trail') {
      const angle = Math.random() * Math.PI * 2;
      const dist = 260 + Math.random() * 220;
      const startX = coords.x + Math.cos(angle) * dist;
      const startY = coords.y + Math.sin(angle) * dist;
      const travelFrames = 50; // matches the 0.02/frame life decay below (~0.8s)
      particles.push({
        x: startX, y: startY,
        vx: (coords.x - startX) / travelFrames,
        vy: (coords.y - startY) / travelFrames,
        life: 1.0, color: state.color,
        size: 6 + Math.random() * 3,
        isTrail: true,
        trail: []
      });
    } else if (type === 'fire') {
      for(let i=0; i<60; i++) {
        particles.push({
          x: coords.x, y: coords.y,
          vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15 - 7,
          life: 1.0 + Math.random()*0.5, color: `rgba(255, ${Math.random()*200}, 0, 1)`,
          size: Math.random() * 15 + 5
        });
      }
    } else if (type === 'star') {
      for(let i=0; i<80; i++) {
        particles.push({
          x: coords.x, y: coords.y,
          vx: (Math.random()-0.5)*25, vy: (Math.random()-0.5)*25,
          life: 1.0 + Math.random(), color: `rgba(255, 255, 255, 1)`,
          size: Math.random() * 5 + 2,
          isStar: true
        });
      }
    } else if (type === 'saber') {
      particles.push({
        x: coords.x, y: coords.y, vx: 0, vy: 0,
        life: 1.5, color: state.color,
        size: 300, isGlow: true
      });
    }
  }

  function renderVFX() {
    ctx.clearRect(0, 0, vfxCanvas.width, vfxCanvas.height);

    bloodPuddles.forEach(b => {
      if (b.radius < b.maxRadius) b.radius += 1.5;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
      ctx.fillStyle = `rgba(138, 3, 3, ${b.alpha})`;
      ctx.fill();
    });

    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.02;

      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = p.life;
      
      if (p.isGlow) {
        let gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * (2 - p.life));
        gradient.addColorStop(0, p.color);
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (2 - p.life), 0, Math.PI*2);
        ctx.fill();
      } else if (p.isTrail) {
        p.trail.push({ x: p.x, y: p.y });
        if (p.trail.length > 14) p.trail.shift();
        for (let t = 0; t < p.trail.length; t++) {
          const seg = p.trail[t];
          const segFrac = t / p.trail.length;
          ctx.globalAlpha = segFrac * p.life;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(seg.x, seg.y, p.size * segFrac, 0, Math.PI*2);
          ctx.fill();
        }
        ctx.globalAlpha = p.life;
        ctx.shadowBlur = 14;
        ctx.shadowColor = p.color;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
      } else if (p.isStar) {
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#fff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
    requestAnimationFrame(renderVFX);
  }

  syncUIWithState();
  renderPresets();
  initDiceBox();
  renderVFX();

</script>
</body>
</html>
