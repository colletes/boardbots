<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=tierlist.html?mode=arena">
<title>Redirecionando para BoardBots Arena &amp; Tierlist Studio...</title>
<link rel="icon" href="../assets/mascot-trimmed.png" type="image/png">
<style>
  body {
    background: #180e09;
    color: #e9c875;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid rgba(233, 200, 117, 0.2);
    border-top-color: #e9c875;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h2 { font-family: 'Poppins', sans-serif; font-size: 1.4rem; margin-bottom: 8px; }
  p { color: #b8a68e; font-size: 0.95rem; margin-bottom: 16px; }
  a { color: #f59e0b; text-decoration: underline; font-weight: 600; }
</style>
<script>
  const searchParams = new URLSearchParams(window.location.search);
  if (!searchParams.has('mode')) {
    searchParams.set('mode', 'arena');
  }
  const targetUrl = 'tierlist.html?' + searchParams.toString() + window.location.hash;
  window.location.replace(targetUrl);
</script>
</head>
<body>
  <div class="spinner"></div>
  <h2>Redirecionando para o Arena &amp; Tierlist Studio...</h2>
  <p>A Arena 1x1 e o Criador de Tierlist agora fazem parte de uma única suíte de torneios e listas!</p>
  <p><a href="tierlist.html?mode=arena">Clique aqui se não for redirecionado automaticamente</a></p>
</body>
</html>
