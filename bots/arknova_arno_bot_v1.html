<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ARNO — Ark Nova Solo Automa (v1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#0b0e12; --bg-1:#12161c;
  --surface:#181d25; --surface-2:#20262f;
  --border:#2b323d; --text:#eef1f5; --text-dim:#9aa4b2;
  --blue:#4f8cff; --blue-soft:#274168; --blue-glow:rgba(79,140,255,0.35);
  --accent:#3fae82; --accent-dim:#2b7859;
  --font-display:'Rye','Segoe UI',serif;
  --font-body:'Inter','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  --radius:14px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--font-body);
  background:radial-gradient(circle at 15% 0%, rgba(79,140,255,0.08), transparent 55%),
             radial-gradient(circle at 85% 100%, rgba(63,174,130,0.08), transparent 50%),
             linear-gradient(180deg, var(--bg-0), var(--bg-1));
  background-attachment:fixed;
  color:var(--text);
  max-width:760px; margin:0 auto; padding:18px;
  padding-left:max(18px, env(safe-area-inset-left));
  padding-right:max(18px, env(safe-area-inset-right));
  padding-bottom:max(18px, env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;
}
button, select, input{ touch-action:manipulation; font-family:inherit; }
.hidden{ display:none !important; }
@keyframes fadeSlideUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
@keyframes popIn{ 0%{transform:scale(0.85); opacity:0;} 60%{transform:scale(1.04);} 100%{transform:scale(1); opacity:1;} }

.hero{ position:relative; border-radius:var(--radius); overflow:hidden; margin-bottom:18px; border:1px solid var(--border); animation:fadeSlideUp 0.5s ease both; }
.hero img{ width:100%; height:170px; object-fit:cover; object-position:top; display:block; filter:saturate(0.9) brightness(0.65); }
.hero::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(11,14,18,0.35) 0%, rgba(11,14,18,0.65) 50%, rgba(11,14,18,0.97) 100%); }
.hero-content{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; padding:14px 18px; }
h1{ font-family:var(--font-display); font-weight:normal; letter-spacing:1px; margin:0; font-size:2em; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,0.6); }
.subtitle{ color:var(--accent); font-size:0.9em; letter-spacing:0.5px; margin-top:2px; font-weight:600; text-shadow:0 2px 8px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.9); }
h2{ font-family:var(--font-display); font-weight:normal; letter-spacing:0.5px; color:var(--accent); margin:0 0 14px; font-size:1.3em; }
h3{ color:var(--text); font-size:1em; margin:16px 0 8px; }
.card{ background:var(--surface); padding:18px; border-radius:var(--radius); border:1px solid var(--border); box-shadow:0 6px 18px rgba(0,0,0,0.35); margin-bottom:16px; animation:fadeSlideUp 0.45s ease both; }
label{ display:block; margin:10px 0 6px; font-size:0.9em; color:var(--text-dim); }
select, input[type=number]{ width:100%; padding:11px 12px; font-size:16px; background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:10px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; }
.row > *{ flex:1; min-width:120px; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 18px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-weight:600; font-size:0.95em; cursor:pointer; min-height:44px; }
.btn:active{ transform:scale(0.97); }
@media (hover:hover) and (pointer:fine){ .btn:hover{ border-color:var(--blue); } .btn-primary:hover{ filter:brightness(1.1); } }
.btn-primary{ background:linear-gradient(145deg, var(--accent), var(--accent-dim)); border-color:var(--accent-dim); color:#fff; width:100%; }
.btn-block{ width:100%; margin-top:8px; }
.toggle{ display:flex; align-items:center; justify-content:space-between; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin-top:10px; }
.switch{ position:relative; width:46px; height:26px; flex-shrink:0; }
.switch input{ opacity:0; width:0; height:0; }
.slider{ position:absolute; inset:0; background:#3a4250; border-radius:26px; transition:.2s; cursor:pointer; }
.slider::before{ content:''; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
input:checked + .slider{ background:var(--accent); }
input:checked + .slider::before{ transform:translateX(20px); }

.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(110px,1fr)); gap:10px; }
.stat{ background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px; text-align:center; }
.stat .lbl{ font-size:0.72em; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; }
.stat .val{ font-size:1.5em; font-weight:800; margin:4px 0; }
.stat .adj{ display:flex; justify-content:center; gap:6px; }
.stat .adj button{ width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:1.1em; min-height:32px; }

.cards-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(96px,1fr)); gap:10px; margin-top:10px; }
.acard{
  --ac-color:var(--accent);
  background:linear-gradient(160deg, color-mix(in srgb, var(--ac-color) 22%, var(--surface-2)), var(--surface-2) 65%);
  border:2px solid var(--border); border-radius:14px; padding:10px 8px 8px; text-align:center; position:relative;
  transition:border-color .2s, box-shadow .2s, transform .2s;
}
.acard.active{ border-color:var(--ac-color); box-shadow:0 0 0 1px var(--ac-color), 0 0 18px color-mix(in srgb, var(--ac-color) 55%, transparent); animation:popIn .35s ease; transform:translateY(-2px); }
.acard .slot{ position:absolute; top:6px; left:8px; font-size:0.7em; color:var(--text-dim); font-weight:700; }
.acard .ac-icon{ width:34px; height:34px; margin:10px auto 6px; color:var(--ac-color); }
.acard .ac-icon svg{ width:100%; height:100%; }
.acard .name{ font-weight:700; margin:0 0 8px; font-size:0.82em; line-height:1.15; }
.acard .side-toggle button{ font-size:0.75em; padding:5px 10px; min-height:28px; border-color:color-mix(in srgb, var(--ac-color) 40%, var(--border)); }

.roll-box{ text-align:center; }
.round-indicator{ color:var(--text-dim); font-size:0.85em; margin:-6px 0 10px; }
.round-indicator b{ color:var(--text); }
.die-wrap{ display:flex; justify-content:center; margin:6px 0 14px; }
.die-face{
  width:84px; height:84px; border-radius:20px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg, var(--surface-2), var(--surface)); border:2px solid var(--border);
  font-size:2.1em; font-weight:800; color:var(--text); box-shadow:0 6px 16px rgba(0,0,0,0.35); user-select:none;
}
.die-face.spinning{ animation:dieSpin .12s linear infinite; border-color:var(--blue); }
.die-face.settled{ animation:popIn .35s ease; border-color:var(--accent); }
@keyframes dieSpin{ 0%{transform:rotate(-6deg) scale(1);} 50%{transform:rotate(6deg) scale(1.05);} 100%{transform:rotate(-6deg) scale(1);} }
.reroll-flash{ color:var(--blue); font-weight:700; font-size:0.9em; min-height:1.2em; margin-bottom:4px; }
.manual-roll{ margin-top:14px; text-align:left; }
.manual-roll summary{ cursor:pointer; color:var(--text-dim); font-size:0.85em; text-align:center; list-style:none; }
.manual-roll summary::-webkit-details-marker{ display:none; }
.manual-roll[open] summary{ margin-bottom:8px; }
.effect-box{ background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:14px; margin-top:12px; text-align:left; }
.effect-box .eff-line{ display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed var(--border); font-size:0.95em; }
.effect-box .eff-line:last-child{ border-bottom:none; }
.effect-box .eff-note{ font-size:0.85em; color:var(--text-dim); margin-top:6px; }
.history-list{ margin-top:14px; text-align:left; max-height:280px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.history-item{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:8px 12px; margin-bottom:8px; font-size:0.85em; }
.history-item .h-head{ display:flex; justify-content:space-between; color:var(--text-dim); font-size:0.85em; margin-bottom:4px; }
.history-item .h-head b{ color:var(--text); }
.history-item .h-lines{ color:var(--text); }
.history-empty{ color:var(--text-dim); font-size:0.85em; text-align:center; padding:10px 0; }

.credits{ display:flex; align-items:center; gap:12px; }
.credits img{ width:52px; height:52px; border-radius:10px; object-fit:cover; }
.credits a{ color:var(--blue); text-decoration:none; }
@media (hover:hover) and (pointer:fine){ .credits a:hover{ text-decoration:underline; } }

.bmc-inline{ display:flex; justify-content:center; align-items:center; gap:8px; margin:14px auto; background:#FFDD00; color:#000; font-weight:700; font-size:0.85em; padding:9px 16px; border-radius:8px; text-decoration:none; box-shadow:0 4px 14px rgba(0,0,0,0.35); transition:transform 0.15s; width:max-content; }
.bmc-inline:hover{ transform:scale(1.05); }
.bmc-inline svg{ width:18px; height:18px; flex-shrink:0; }

.btn-help-float{ position:fixed; bottom:20px; right:20px; width:50px; height:50px; border-radius:50%; background:var(--accent); color:#fff; border:none; font-size:1.3em; font-weight:800; box-shadow:0 4px 14px rgba(0,0,0,0.4); z-index:50; }
.modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:100; display:flex; align-items:center; justify-content:center; padding:18px; }
.modal{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); max-width:640px; width:100%; max-height:85vh; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:20px; }
.modal h3{ color:var(--accent); }
.modal-close{ float:right; }
.lang-switch{ position:fixed; top:14px; right:14px; z-index:60; display:flex; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:4px; }
.lang-switch button{ border:none; background:transparent; color:var(--text-dim); padding:5px 10px; border-radius:16px; font-size:0.8em; font-weight:700; min-height:30px; }
.lang-switch button.active{ background:var(--accent); color:#fff; }
@media (min-width:600px){ .hero img{ height:210px; } h1{ font-size:2.4em; } }
</style>
</head>
<body>
<div class="lang-switch">
  <button id="btnPt" onclick="setLang('pt')">PT</button>
  <button id="btnEn" onclick="setLang('en')">EN</button>
</div>

<div class="hero">
  <img src="../assets/art/arknova.webp" alt="Ark Nova">
  <div class="hero-content">
    <h1>ARNO</h1>
    <div class="subtitle" data-i18n="subtitle"></div>
  </div>
</div>

<!-- SETUP SCREEN -->
<div id="setup-screen">
  <div class="card">
    <h2 data-i18n="setupTitle"></h2>
    <label data-i18n="lblLevel"></label>
    <select id="selLevel"></select>

    <label data-i18n="lblDie"></label>
    <select id="selDie">
      <option value="6">D6</option>
      <option value="8">D8</option>
      <option value="12">D12</option>
    </select>

    <div class="toggle">
      <span data-i18n="lblMarine"></span>
      <label class="switch"><input type="checkbox" id="chkMarine"><span class="slider"></span></label>
    </div>
    <div class="toggle">
      <span data-i18n="lblCPModule"></span>
      <label class="switch"><input type="checkbox" id="chkCPModule"><span class="slider"></span></label>
    </div>

    <h3 data-i18n="lblAssign"></h3>
    <p class="eff-note" style="color:var(--text-dim); font-size:0.85em;" data-i18n="assignHelp"></p>
    <div class="cards-grid" id="setupSlotsPreview"></div>
    <button class="btn btn-block" onclick="shuffleSlots()" data-i18n="btnReshuffle" style="margin-top:10px;"></button>

    <button class="btn btn-primary btn-block" onclick="startGame()" data-i18n="btnStart"></button>
  </div>
  <div class="card credits">
    <img src="../assets/art/arknova.webp" alt="">
    <div>
      <div data-i18n="creditsLine1"></div>
      <div data-i18n="creditsLine2"></div>
      <div>ARNO: <a href="https://boardgamegeek.com/profile/anke79" target="_blank" rel="noopener">Andre K. (anke79)</a></div>
      <div><a href="mailto:colletes@gmail.com">colletes@gmail.com</a></div>
    </div>
  </div>
</div>

<!-- GAME SCREEN -->
<div id="game-area" class="hidden">
  <div class="card">
    <h2 data-i18n="statsTitle"></h2>
    <div class="stat-grid">
      <div class="stat"><div class="lbl" data-i18n="statAppeal"></div><div class="val" id="vAppeal">0</div><div class="adj"><button onclick="adjust('appeal',-1)">−</button><button onclick="adjust('appeal',1)">+</button></div></div>
      <div class="stat"><div class="lbl" data-i18n="statRep"></div><div class="val" id="vRep">0</div><div class="adj"><button onclick="adjust('rep',-1)">−</button><button onclick="adjust('rep',1)">+</button></div></div>
      <div class="stat"><div class="lbl" data-i18n="statCons"></div><div class="val" id="vCons">0</div><div class="adj"><button onclick="adjust('cons',-1)">−</button><button onclick="adjust('cons',1)">+</button></div></div>
      <div class="stat"><div class="lbl" data-i18n="statBreak"></div><div class="val" id="vBreak">0</div><div class="adj"><button onclick="adjust('brk',-1)">−</button><button onclick="adjust('brk',1)">+</button></div></div>
      <div class="stat"><div class="lbl" data-i18n="statCards"></div><div class="val" id="vCards">0</div><div class="adj"><button onclick="adjust('cards',-1)">−</button><button onclick="adjust('cards',1)">+</button></div></div>
      <div class="stat"><div class="lbl" data-i18n="statZoos"></div><div class="val" id="vZoos">0</div><div class="adj"><button onclick="adjust('zoos',-1)">−</button><button onclick="adjust('zoos',1)">+</button></div></div>
      <div class="stat"><div class="lbl" data-i18n="statUnis"></div><div class="val" id="vUnis">0</div><div class="adj"><button onclick="adjust('unis',-1)">−</button><button onclick="adjust('unis',1)">+</button></div></div>
      <div class="stat"><div class="lbl" data-i18n="statWorkers"></div><div class="val" id="vWorkers">3</div><div class="adj"><button onclick="adjust('workers',-1)">−</button><button onclick="adjust('workers',1)">+</button></div></div>
      <div class="stat"><div class="lbl" data-i18n="statFsTokens"></div><div class="val" id="vFsTokens">0/6</div><div class="adj"><button onclick="adjust('fsTokens',-1)">−</button><button onclick="adjust('fsTokens',1)">+</button></div></div>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="cardsTitle"></h2>
    <div class="cards-grid" id="cardsGrid"></div>
  </div>

  <div class="card roll-box">
    <h2 data-i18n="rollTitle"></h2>
    <p class="round-indicator"><span data-i18n="lblRound"></span> <b id="roundNo">1</b></p>
    <p class="eff-note" id="dieHint" style="color:var(--text-dim);"></p>
    <div class="die-wrap"><div class="die-face" id="dieFace">?</div></div>
    <div class="reroll-flash" id="rerollFlash"></div>
    <button class="btn btn-primary btn-block" id="btnRoll" onclick="rollDice()" data-i18n="btnRoll"></button>
    <details class="manual-roll">
      <summary data-i18n="lblManual"></summary>
      <input type="number" id="rollInput" min="1" style="max-width:140px; margin:0 auto 8px; display:block; text-align:center; font-size:1.3em;">
      <button class="btn btn-block" onclick="resolveManualRoll()" data-i18n="btnResolve"></button>
    </details>
    <div id="rollOut"></div>
    <h3 data-i18n="lblHistory" style="margin-top:18px;"></h3>
    <div class="history-list" id="historyList"></div>
  </div>

  <button class="btn btn-block" onclick="resetGame()" data-i18n="btnReset"></button>
</div>

<a class="bmc-inline" href="https://www.buymeacoffee.com/colletes" target="_blank" rel="noopener" aria-label="Buy me a coffee"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13a2 2 0 0 1 2 2v1a3 3 0 0 1-3 3h-1"/><path d="M4 8h13v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8Z"/><path d="M8 3c-.6 1 .5 1.6 0 3M12 3c-.6 1 .5 1.6 0 3"/></svg><span data-i18n="bmcBtn">Me pague um café</span></a>

<button class="btn-help-float" onclick="document.getElementById('helpModal').classList.remove('hidden')">?</button>
<div id="helpModal" class="modal-overlay hidden">
  <div class="modal">
    <button class="btn modal-close" onclick="document.getElementById('helpModal').classList.add('hidden')" data-i18n="btnClose"></button>
    <h3 data-i18n="helpTitle"></h3>
    <div data-i18n-html="helpBody"></div>
  </div>
</div>

<script>
document.addEventListener('touchstart', function(){}, {passive:true});

/* ============ ARNO data tables (transcribed from the official ARNO 3.0 action cards + rulebook text) ============
   Levels are clamped: index 0..5 = L1..L6 ("green" cards L1-3, "red" cards L4-6). Per the rulebook,
   "At L7+ ARNO is using the values of L6+", so lvlIdx() clamps to index 5 for any level above 6.
   X = the die-rolled position (2,3,4,5) for this turn.
   Icon legend confirmed from the cards: black diamond = Reputation, salmon ticket = Appeal,
   green shield = Conservation, coffee mug = Break, folder"?" = draw a random card,
   list/box = place Final Scoring token(s). Sponsors and Association cards are marked BLUE and are
   used unchanged at every difficulty level (only Animals/Cards/Build have green/red level tiers). */
const ANIMALS = { // Appeal bonus on top of X, per side/level
  I:  [0,1,1, 1,2,3],   // L1..L6
  II: [1,1,2, 2,3,4]
};
const CARDS = {
  I:  { appeal:[1,2,2, 3,3,3], cons:1, brk:1, draw:1 },
  II: { cons:2, brk:1, draw:1 }               // no Appeal on side II
};
const BUILD = {
  I: {
    pos2_rep:  [1,1,1, 2,2,2],
    pos3_app:  [2,3,3, 4,4,5],
    pos5_cons: [2,3,3, 3,3,4]
    // pos4: draw 1 card + Reputation +1, flat at every level (both tiers)
  },
  II: {
    pos2_rep:  [1,1,1, 2,2,2],   // per the ARNO cards: flat 1 for L1-3, flat 2 for L4-6+, no card draw on side II
    pos3_app:  [3,3,4, 5,5,5],
    pos4_fs:   [1,1,1, 2,2,2],   // Final Scoring tokens placed; no card draw on side II
    pos5_cons: [3,3,3, 4,4,4]
  }
};
const SPONSORS = { // Reputation +1 only on side I; both sides: Break +X, place 1 Final Scoring token
  I:  { rep:1 },
  II: {}          // side II additionally grants Appeal +X; the "maxed FS card -> Conservation +2" fallback is side I only
};
const ASSOCIATION = {
  // effect granted by the task slot a worker is placed on (same for side I and II)
  slotEffect: { 2:'rep2', 3:'zoo', 4:'uni', 5:'project' },
  na: { cons:1, brk:2 }  // no free worker left: Conservation +1, Break +2, + Partner Zoo OR University
};
const ACTION_KEYS = ['cards','build','sponsors','association'];

const LANG_KEY = 'boardbots_lang';
const STORAGE_KEY='arno_state_v1';

const I18N = {
  pt:{
    subtitle:'Automa Solo para Ark Nova — por Andre K.',
    setupTitle:'Configuração',
    lblLevel:'Nível de dificuldade',
    lblDie:'Dado usado',
    lblMarine:'Expansão Marine Worlds',
    lblCPModule:'Módulo: condição variável do Projeto de Conservação',
    lblAssign:'Distribuição das ações nos espaços 2–5',
    assignHelp:'O app já sorteou aleatoriamente em qual espaço cada carta de ação caiu — não é preciso embaralhar as cartas físicas.',
    btnReshuffle:'🔀 Sortear novamente',
    bmcBtn:'Me pague um café',
    btnStart:'Iniciar automa',
    creditsLine1:'Bot criado para uso pessoal — Colletes bots.',
    creditsLine2:'Automa ARNO original de Ark Nova:',
    statsTitle:'Painel do ARNO',
    statAppeal:'Atração', statRep:'Reputação', statCons:'Conservação', statBreak:'Pausa',
    statCards:'Cartas', statZoos:'Zoos Parceiros', statUnis:'Universidades', statWorkers:'Associados livres',
    statFsTokens:'Fichas Pontuação Final',
    cardsTitle:'Cartas de ação',
    rollTitle:'Turno do ARNO',
    lblRound:'Rodada',
    btnRoll:'🎲 Rolar dado',
    lblManual:'Prefere digitar o valor de um dado físico?',
    btnResolve:'Aplicar valor digitado',
    lblHistory:'Histórico de rodadas',
    btnReset:'Reiniciar automa',
    btnClose:'Fechar',
    helpTitle:'Como jogar contra o ARNO',
    helpBody:`<p>Toque em <b>Rolar dado</b> para o app rolar o dado configurado (com animação) e resolver o turno do ARNO sozinho — inclusive rerolando automaticamente em 1 ou 6 no D6. Se preferir usar um dado físico, abra "Prefere digitar o valor de um dado físico?" para digitar o resultado manualmente.</p>
      <p>O ARNO sempre executa a ação <b>Animais</b> (Atração +X, onde X é a posição sorteada) e, além dela, a ação que estiver no espaço sorteado (2–5). Todos os valores numéricos (Atração, Reputação, Conservação, Pausa, Cartas, Zoos, Universidades, Associados, Fichas de Pontuação Final) são calculados e aplicados automaticamente ao painel — os botões +/− continuam disponíveis para qualquer correção manual.</p>
      <p>Os valores já consideram o nível de dificuldade e o lado (I ou II) de cada carta — toque no botão I/II sobre cada carta para marcá-la como melhorada quando isso acontecer no jogo físico.</p>

let lang = localStorage.getItem(LANG_KEY) || 'pt';
function t(k){ return I18N[lang][k] || k; }
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{ el.innerHTML = t(el.dataset.i18nHtml); });
  document.getElementById('btnPt').classList.toggle('active', lang==='pt');
  document.getElementById('btnEn').classList.toggle('active', lang==='en');
  document.title = lang==='pt' ? 'ARNO — Automa Solo de Ark Nova (v1)' : 'ARNO — Ark Nova Solo Automa (v1)';
  refreshCardsUI();
  renderSetupSlotsPreview();
  renderStats();
}
function setLang(l){ lang=l; localStorage.setItem(LANG_KEY,l); applyI18n(); }

const ACTION_LABEL = { pt:{cards:'Cartas',build:'Construção',sponsors:'Patrocinadores',association:'Associação',animals:'Animais'},
                       en:{cards:'Cards',build:'Build',sponsors:'Sponsors',association:'Association',animals:'Animals'} };

// Simple flat-line icon set (inline SVG, single-color) rendered on each action-card tile.
const ACTION_ICON = {
  animals: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="6" r="1.6"/><circle cx="12" cy="4.6" r="1.6"/><circle cx="17" cy="6" r="1.6"/><circle cx="19" cy="10.5" r="1.5"/><path d="M12 10c-2.8 0-5.4 1.9-6.4 4.6-.8 2.1.5 4.4 2.7 4.4.9 0 1.7-.3 2.6-.7.4-.2.7-.3 1.1-.3s.7.1 1.1.3c.9.4 1.7.7 2.6.7 2.2 0 3.5-2.3 2.7-4.4C17.4 11.9 14.8 10 12 10z"/></svg>',
  cards: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="12" height="15" rx="2"/><rect x="8" y="7" width="12" height="15" rx="2" opacity="0.5"/></svg>',
  build: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.4-3.4a1 1 0 0 0 0-1.4L19.5 3a1 1 0 0 0-1.4 0z"/><path d="M9 12L3 18v3h3l6-6"/><path d="M13 7l4 4"/></svg>',
  sponsors: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 7.1-1.01z"/></svg>',
  association: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M15 20c.2-2.5 1.6-4.6 3.6-5.6"/></svg>'
};
const ACTION_COLOR = { animals:'#3fae82', cards:'#4f8cff', build:'#e0954a', sponsors:'#d8b34a', association:'#b56ce0' };

let state = null;

function populateSetupSelects(){
  const selLevel = document.getElementById('selLevel');
  selLevel.innerHTML='';
  for(let i=1;i<=12;i++){ const o=document.createElement('option'); o.value=i; o.textContent = i<=6?('L'+i):('L'+i+' (L6+ table)'); selLevel.appendChild(o); }
  shuffleSlots();
}

// Randomly assigns the 4 action cards to slots 2-5 (the app replaces the physical shuffle).
let setupSlots = null;
function shuffleSlots(){
  const keys = [...ACTION_KEYS];
  for(let i=keys.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [keys[i],keys[j]]=[keys[j],keys[i]]; }
  setupSlots = { 2:keys[0], 3:keys[1], 4:keys[2], 5:keys[3] };
  renderSetupSlotsPreview();
}
function renderSetupSlotsPreview(){
  const grid = document.getElementById('setupSlotsPreview');
  if(!grid || !setupSlots) return;
  grid.innerHTML='';
  [2,3,4,5].forEach(p=>{
    const key = setupSlots[p];
    const div = document.createElement('div');
    div.className = 'acard';
    div.style.setProperty('--ac-color', ACTION_COLOR[key]);
    div.innerHTML = `<div class="slot">#${p}</div>
      <div class="ac-icon">${ACTION_ICON[key]}</div>
      <div class="name">${ACTION_LABEL[lang][key]}</div>`;
    grid.appendChild(div);
  });
}

function startGame(){
  const level = parseInt(document.getElementById('selLevel').value,10);
  const die = parseInt(document.getElementById('selDie').value,10);
  const marine = document.getElementById('chkMarine').checked;
  const cpModule = document.getElementById('chkCPModule').checked;
  const slots = { 1:'animals', ...setupSlots };

  let cons = -5 + Math.max(0, level-6);
  if(marine) cons += 2;

  state = {
    level, die, marine, cpModule, slots,
    sides:{ animals:'I', cards:'I', build:'I', sponsors:'I', association:'I' },
    appeal:0, rep:0, cons, brk:0, cards:0, zoos:0, unis:0, workers:3, fsTokens:0,
    assocSlots:{2:false,3:false,4:false,5:false},
    lastPos:null, lastKey:null, pendingCycle:null, round:1, history:[]
  };
  save();
  document.getElementById('setup-screen').classList.add('hidden');
  document.getElementById('game-area').classList.remove('hidden');
  refreshCardsUI(); renderStats(); updateDieHint(); renderHistory();
}

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    state = JSON.parse(raw);
    if(!state) return false;
    if(typeof state.round !== 'number') state.round = 1;
    if(!Array.isArray(state.history)) state.history = [];
    return true;
  }catch(e){ return false; }
}

function resetGame(){
  if(!confirm(lang==='pt'?'Reiniciar o automa do zero?':'Reset the automa from scratch?')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = null;
  document.getElementById('game-area').classList.add('hidden');
  document.getElementById('setup-screen').classList.remove('hidden');
}

function adjust(key,delta){
  const map={appeal:'appeal',rep:'rep',cons:'cons',brk:'brk',cards:'cards',zoos:'zoos',unis:'unis',workers:'workers',fsTokens:'fsTokens'};
  const k=map[key];
  state[k]+=delta;
  if(k==='brk'){ if(state.brk<0) state.brk=0; if(state.brk>6) state.brk=6; }
  if(k==='workers'){ if(state.workers<0) state.workers=0; }
  if(k==='fsTokens'){ if(state.fsTokens<0) state.fsTokens=0; if(state.fsTokens>6) state.fsTokens=6; }
  save(); renderStats();
}
function renderStats(){
  if(!state) return;
  document.getElementById('vAppeal').textContent = state.appeal;
  document.getElementById('vRep').textContent = state.rep;
  document.getElementById('vCons').textContent = state.cons;
  document.getElementById('vBreak').textContent = state.brk + '/6';
  document.getElementById('vCards').textContent = state.cards;
  document.getElementById('vZoos').textContent = state.zoos;
  document.getElementById('vUnis').textContent = state.unis;
  document.getElementById('vWorkers').textContent = state.workers;
  document.getElementById('vFsTokens').textContent = state.fsTokens + '/6';
}

function lvlIdx(){ return Math.min(state.level,6)-1; }

function refreshCardsUI(){
  const grid = document.getElementById('cardsGrid');
  if(!grid) return;
  // FLIP animation: remember each card's on-screen position (by identity) so a slot change can slide smoothly instead of snapping.
  const prevRects = {};
  grid.querySelectorAll('.acard').forEach(el=>{ prevRects[el.dataset.key] = el.getBoundingClientRect(); });
  grid.innerHTML='';
  const order = [1,2,3,4,5].map(p=> ({key: state && state.slots ? state.slots[p] : (p===1?'animals':ACTION_KEYS[p-2]), slot:p}));
  order.forEach(o=>{
    const div = document.createElement('div');
    // Highlight by card identity, not slot — slots 2-5 cycle after each use (Ark Nova rules p.8), so the used card no longer sits at the rolled position.
    const isActive = state && state.lastKey && o.key===state.lastKey;
    div.className = 'acard' + (isActive ? ' active' : '');
    div.dataset.key = o.key;
    div.style.setProperty('--ac-color', ACTION_COLOR[o.key]);
    const side = state ? state.sides[o.key] : 'I';
    div.innerHTML = `<div class="slot">#${o.slot}</div>
      <div class="ac-icon">${ACTION_ICON[o.key]}</div>
      <div class="name">${ACTION_LABEL[lang][o.key]}</div>
      <div class="side-toggle">
        <button class="btn" onclick="flipSide('${o.key}')">${side}</button>
      </div>`;
    grid.appendChild(div);
  });
  grid.querySelectorAll('.acard').forEach(el=>{
    const prev = prevRects[el.dataset.key];
    if(!prev) return;
    const next = el.getBoundingClientRect();
    const dx = prev.left - next.left, dy = prev.top - next.top;
    if(!dx && !dy) return;
    el.style.transition = 'none';
    el.style.transform = `translate(${dx}px, ${dy}px)`;
    requestAnimationFrame(()=>{
      el.style.transition = 'transform .5s ease';
      el.style.transform = '';
    });
  });
}
function flipSide(key){
  state.sides[key] = state.sides[key]==='I' ? 'II' : 'I';
  save(); refreshCardsUI();
}

function updateDieHint(){
  const hint = document.getElementById('dieHint');
  if(!state) return;
  if(state.die===6) hint.textContent = lang==='pt' ? 'Dado: D6 (rola sozinho, em 1 ou 6 role novamente).' : 'Die: D6 (rolls itself, reroll on 1 or 6).';
  if(state.die===8) hint.textContent = lang==='pt' ? 'Dado: D8 (1–2→#2, 3–4→#3, 5–6→#4, 7–8→#5).' : 'Die: D8 (1–2→#2, 3–4→#3, 5–6→#4, 7–8→#5).';
  if(state.die===12) hint.textContent = lang==='pt' ? 'Dado: D12 (1–3→#2, 4–6→#3, 7–9→#4, 10–12→#5).' : 'Die: D12 (1–3→#2, 4–6→#3, 7–9→#4, 10–12→#5).';
  document.getElementById('rollInput').max = state.die;
  const face = document.getElementById('dieFace'); if(face) face.textContent = '?';
  const flash = document.getElementById('rerollFlash'); if(flash) flash.textContent = '';
  const roundNo = document.getElementById('roundNo'); if(roundNo) roundNo.textContent = state.round || 1;
}

function positionFromRoll(v){
  if(state.die===6){
    if(v<2||v>5) return null; // reroll
    return v;
  }
  if(state.die===8){
    return Math.min(5, 2 + Math.floor((v-1)/2));
  }
  if(state.die===12){
    return Math.min(5, 2 + Math.floor((v-1)/3));
  }
  return null;
}

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }
function spinFace(face, ms){
  return new Promise(resolve=>{
    face.classList.remove('settled'); face.classList.add('spinning');
    const iv = setInterval(()=>{ face.textContent = 1+Math.floor(Math.random()*state.die); }, 60);
    setTimeout(()=>{ clearInterval(iv); face.classList.remove('spinning'); resolve(); }, ms);
  });
}

// Rolls the configured virtual die with a short spin animation, transparently re-rolling on 1/6 (D6) until a valid position lands.
async function rollDice(){
  if(!state) return;
  await performPendingCycle();
  const btn = document.getElementById('btnRoll');
  const face = document.getElementById('dieFace');
  const flash = document.getElementById('rerollFlash');
  btn.disabled = true;
  flash.textContent = '';
  let pos = null, value = null, guard = 0;
  do{
    await spinFace(face, 500 + Math.random()*200);
    value = 1 + Math.floor(Math.random()*state.die);
    face.textContent = value;
    face.classList.add('settled');
    pos = positionFromRoll(value);
    guard++;
    if(pos===null){
      flash.textContent = lang==='pt' ? `Rolou ${value} — role novamente!` : `Rolled ${value} — reroll!`;
      await sleep(700);
      face.classList.remove('settled');
      flash.textContent = '';
    }
  } while(pos===null && guard<12);
  btn.disabled = false;
  applyTurn(pos, value);
}

async function resolveManualRoll(){
  if(!state) return;
  await performPendingCycle();
  const v = parseInt(document.getElementById('rollInput').value,10);
  if(!v || v<1 || v>state.die) return;
  const face = document.getElementById('dieFace');
  face.textContent = v; face.classList.add('settled'); setTimeout(()=>face.classList.remove('settled'),350);
  const pos = positionFromRoll(v);
  const flash = document.getElementById('rerollFlash');
  if(pos===null){ flash.textContent = lang==='pt' ? `Rolou ${v} — role novamente!` : `Rolled ${v} — reroll!`; return; }
  flash.textContent = '';
  applyTurn(pos, v);
}

// Applies the rolled position's effects directly to ARNO's counters and logs the turn in history.
// Ark Nova rules p.8: after using a card, it returns to the lowest slot (1) and the cards left of it shift right.
// Animals is only fixed at slot 1 for the initial setup/turn 1 — after that it cycles like any other card.
function cycleUsedSlot(pos){
  const order = [1,2,3,4,5].map(p=>state.slots[p]);
  const used = order.splice(pos-1,1)[0];
  order.unshift(used);
  [1,2,3,4,5].forEach((p,k)=>{ state.slots[p]=order[k]; });
}

// The cycle move is deferred until the start of the next roll (see performPendingCycle) so the just-used
// card visibly slides into slot 1 instead of snapping there the instant this turn resolves.
async function performPendingCycle(){
  if(state.pendingCycle==null) return;
  const pos = state.pendingCycle;
  state.pendingCycle = null;
  cycleUsedSlot(pos);
  save(); refreshCardsUI();
  await sleep(550);
}

function applyTurn(pos, rolledValue){
  state.lastPos = pos;
  const idx = lvlIdx();
  const lines = [];

  const actionKey = state.slots[pos];
  const side = state.sides[actionKey];
  lines.push(...effectLines(actionKey, side, pos, idx));
  state.lastKey = actionKey;
  state.pendingCycle = pos;

  const out = document.getElementById('rollOut');
  out.innerHTML = `<div class="effect-box">
      <div class="eff-line"><b>${lang==='pt'?'Posição sorteada':'Rolled position'}</b><span>#${pos}${rolledValue!=null?` (d${state.die}=${rolledValue})`:''}</span></div>
      ${lines.map(l=>`<div class="eff-line"><span>${l.label}</span><span>${l.text}</span></div>`).join('')}
    </div>`;

  state.history.unshift({ round: state.round, pos, actionKey, side, lines: lines.map(l=>({label:l.label, text:l.text})) });
  if(state.history.length>15) state.history.pop();
  state.round++;
  const roundNo = document.getElementById('roundNo'); if(roundNo) roundNo.textContent = state.round;

  save(); refreshCardsUI(); renderStats(); renderHistory();
}

function renderHistory(){
  const el = document.getElementById('historyList');
  if(!el || !state) return;
  if(!state.history.length){ el.innerHTML = `<div class="history-empty">${lang==='pt'?'Nenhuma rodada resolvida ainda.':'No rounds resolved yet.'}</div>`; return; }
  el.innerHTML = state.history.map(h=>`
    <div class="history-item">
      <div class="h-head"><b>${lang==='pt'?'Rodada':'Round'} ${h.round}</b><span>#${h.pos} · ${ACTION_LABEL[lang][h.actionKey]} (${h.side})</span></div>
      <div class="h-lines">${h.lines.map(l=>`${l.label}: ${l.text}`).join(' · ')}</div>
    </div>`).join('');
}

function effectLines(key, side, pos, idx){
  const L = lang;
  const lines = [];
  if(key==='animals'){
    const gain = pos + ANIMALS[side][idx];
    state.appeal += gain;
    lines.push({label:`Animals ${side} (#${pos})`, text:`${L==='pt'?'Atração':'Appeal'} +${gain}`});
  } else if(key==='cards'){
    const t = CARDS[side];
    const parts = [];
    if(t.appeal){ state.appeal += t.appeal[idx]; parts.push(`${L==='pt'?'Atração':'Appeal'} +${t.appeal[idx]}`); }
    state.cons += t.cons; parts.push(`${L==='pt'?'Conservação':'Conservation'} +${t.cons}`);
    state.brk = Math.min(6, state.brk + t.brk); parts.push(`${L==='pt'?'Pausa':'Break'} +${t.brk}`);
    state.cards += t.draw; parts.push(L==='pt' ? 'compra 1 carta' : 'draw 1 card');
    lines.push({label:`Cards ${side}`, text: parts.join(', ')});
  } else if(key==='build'){
    const t = BUILD[side];
    let extra;
    if(pos===2){
      const repGain = t.pos2_rep[idx];
      state.rep += repGain;
      extra = `${L==='pt'?'Reputação':'Reputation'} +${repGain}`;
    } else if(pos===3){
      state.appeal += t.pos3_app[idx];
      extra = `${L==='pt'?'Atração':'Appeal'} +${t.pos3_app[idx]}`;
    } else if(pos===4){
      if(side==='I'){
        state.cards += 1; state.rep += 1;
        extra = L==='pt' ? 'Compra 1 carta, Reputação +1' : 'Draw 1 card, Reputation +1';
      } else {
        // Side II only places Final Scoring tokens, no card draw (rulebook has no draw here).
        const n = t.pos4_fs[idx];
        state.fsTokens = Math.min(6, state.fsTokens + n);
        extra = L==='pt' ? `Coloca ${n} ficha(s) de Pontuação Final` : `Place ${n} Final Scoring token(s)`;
      }
    } else {
      state.cons += t.pos5_cons[idx];
      extra = `${L==='pt'?'Conservação':'Conservation'} +${t.pos5_cons[idx]}`;
    }
    lines.push({label:`Build ${side} (#${pos})`, text: extra});
  } else if(key==='sponsors'){
    const parts = [];
    if(side==='I'){ state.rep += 1; parts.push(`${L==='pt'?'Reputação':'Reputation'} +1`); }
    state.brk = Math.min(6, state.brk + pos);
    parts.push(`${L==='pt'?'Pausa':'Break'} +${pos}`);
    if(side==='II'){ state.appeal += pos; parts.push(`${L==='pt'?'Atração':'Appeal'} +${pos}`); }
    if(state.fsTokens>=6){
      // Rulebook: the maxed-out Conservation +2 conversion only applies "as long as the Action card is on level I".
      if(side==='I'){
        state.cons += 2;
        parts.push(L==='pt' ? 'Conservação +2 (fichas de Pontuação Final no máximo)' : 'Conservation +2 (Final Scoring tokens maxed)');
      }
    } else {
      state.fsTokens++;
      parts.push(L==='pt' ? 'coloca 1 ficha de Pontuação Final' : 'place 1 Final Scoring token');
    }
    lines.push({label:`Sponsors ${side}`, text: parts.join(', ')});
  } else if(key==='association'){
    if(state.workers<=0){
      state.cons += ASSOCIATION.na.cons;
      state.brk = Math.min(6, state.brk + ASSOCIATION.na.brk);
      let gained;
      if(state.zoos < state.unis){ state.zoos++; gained = L==='pt'?'Zoo Parceiro':'Partner Zoo'; }
      else if(state.unis < state.zoos){ state.unis++; gained = L==='pt'?'Universidade':'University'; }
      else if(Math.random()<0.5){ state.zoos++; gained = L==='pt'?'Zoo Parceiro':'Partner Zoo'; }
      else { state.unis++; gained = L==='pt'?'Universidade':'University'; }
      lines.push({label:`Association ${side} (${L==='pt'?'sem associado':'no worker'})`,
        text:`${L==='pt'?'Conservação':'Conservation'} +${ASSOCIATION.na.cons}, ${L==='pt'?'Pausa':'Break'} +${ASSOCIATION.na.brk}, +${gained}`});
    } else {
      const target = findAssocSlot(pos);
      let effectText;
      if(target===2){ state.rep += 2; effectText = L==='pt'?'Reputação +2':'Reputation +2'; }
      else if(target===3){ state.zoos++; effectText = L==='pt'?'ganha Zoo Parceiro':'gain Partner Zoo'; }
      else if(target===4){ state.unis++; effectText = L==='pt'?'ganha Universidade':'gain University'; }
      else { effectText = L==='pt'?'avança Projeto de Conservação':'advance Conservation Project'; }
      const redirNote = target!==pos ? (L==='pt'?` (redirecionado do #${pos})`:` (redirected from #${pos})`) : '';
      state.assocSlots[target] = true;
      state.workers--;
      let placedText = `${effectText}, ${L==='pt'?'coloca 1 associado':'places 1 worker'}`;
      if(side==='II'){
        // Rulebook: side II also makes a donation whenever a worker is placed.
        state.cons += 1;
        placedText += L==='pt' ? ', doação: Conservação +1' : ', donation: Conservation +1';
      }
      lines.push({label:`Association ${side} (#${target})${redirNote}`, text: placedText});
    }
  }
  return lines;
}
function findAssocSlot(pos){
  if(!state.assocSlots[pos]) return pos;
  for(let p=pos+1;p<=5;p++){ if(!state.assocSlots[p]) return p; }
  for(let p=pos-1;p>=2;p--){ if(!state.assocSlots[p]) return p; }
  return pos; // safety fallback; shouldn't happen while workers>0 (3 workers, 4 slots)
}

  document.getElementById('setup-screen').classList.add('hidden');
  document.getElementById('game-area').classList.remove('hidden');
}
applyI18n();
if(state){ updateDieHint(); renderHistory(); }
