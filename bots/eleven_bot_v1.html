<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Eleven — Gerador de Campanha &amp; Resolvedor de Partidas (v1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#0b0e12; --bg-1:#12161c;
  --surface:#181d25; --surface-2:#20262f;
  --border:#2b323d; --text:#eef1f5; --text-dim:#9aa4b2;
  --blue:#4f8cff; --blue-soft:#274168; --blue-glow:rgba(79,140,255,0.35);
  --accent:#2fae60; --accent-dim:#1f7a44; --gold:#f1c40f;
  --font-display:'Anton','Segoe UI',sans-serif;
  --font-body:'Inter','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  --radius:14px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--font-body);
  background:radial-gradient(circle at 15% 0%, rgba(47,174,96,0.10), transparent 55%),
             radial-gradient(circle at 85% 100%, rgba(79,140,255,0.08), transparent 50%),
             repeating-linear-gradient(112deg, rgba(47,174,96,0.05) 0px, rgba(47,174,96,0.05) 46px, transparent 46px, transparent 92px),
             linear-gradient(180deg, var(--bg-0), var(--bg-1));
  background-attachment:fixed;
  color:var(--text);
  max-width:820px; margin:0 auto; padding:18px;

  padding-left:max(18px, env(safe-area-inset-left));
  padding-right:max(18px, env(safe-area-inset-right));
  padding-bottom:max(18px, env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;
}
button, select, input{ touch-action:manipulation; font-family:inherit; }
.hidden{ display:none !important; }
@keyframes fadeSlideUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
@keyframes popIn{ 0%{transform:scale(0.85); opacity:0;} 60%{transform:scale(1.04);} 100%{transform:scale(1); opacity:1;} }
@keyframes spin{ to{ transform:rotate(360deg); } }

.hero{ position:relative; border-radius:var(--radius); overflow:hidden; margin-bottom:12px; border:1px solid var(--border); animation:fadeSlideUp 0.5s ease both; }
.hero img{ width:100%; height:170px; object-fit:cover; object-position:top; display:block; filter:saturate(0.9) brightness(0.65); }
.hero::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(11,14,18,0.35) 0%, rgba(11,14,18,0.65) 50%, rgba(11,14,18,0.97) 100%); }
.hero-content{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; padding:14px 18px; }
.hero-pitch-mark{ position:absolute; right:12px; top:12px; width:52px; height:52px; opacity:0.22; z-index:1; pointer-events:none; }
.pitch-divider{ height:12px; border-radius:6px; margin-bottom:18px; background:repeating-linear-gradient(90deg, var(--accent) 0 26px, var(--accent-dim) 26px 52px); box-shadow:inset 0 0 0 1px rgba(255,255,255,0.15); animation:fadeSlideUp 0.5s ease both; }
h1{ font-family:var(--font-display); font-weight:normal; letter-spacing:0.5px; margin:0; font-size:2em; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,0.6); }
.subtitle{ color:var(--accent); font-size:0.9em; letter-spacing:0.5px; margin-top:2px; font-weight:600; text-shadow:0 2px 8px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.9); }
h2{ font-family:var(--font-display); font-weight:normal; letter-spacing:0.5px; color:var(--accent); margin:0 0 16px; font-size:1.3em; position:relative; padding-bottom:10px; }
h2::after{ content:''; position:absolute; left:0; bottom:0; width:52px; height:4px; border-radius:2px; background:repeating-linear-gradient(90deg, var(--accent) 0 8px, var(--accent-dim) 8px 16px); }
h3{ color:var(--text); font-size:1em; margin:14px 0 8px; }
p.intro{ color:var(--text-dim); font-size:0.92em; margin:0 0 16px; }
.card{ background:var(--surface); padding:18px; border-radius:var(--radius); border:1px solid var(--border); box-shadow:0 6px 18px rgba(0,0,0,0.35); margin-bottom:16px; animation:fadeSlideUp 0.45s ease both; }
label{ display:block; margin:10px 0 6px; font-size:0.9em; color:var(--text-dim); }
select, input[type=number], input[type=text]{ width:100%; padding:11px 12px; font-size:16px; background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:10px; }
.checkbox-group{ display:flex; align-items:center; gap:10px; margin-top:14px; }
.checkbox-group label{ margin:0; color:var(--text); }
.label-row{ display:flex; align-items:center; gap:6px; margin:10px 0 6px; }
.label-row label{ margin:0; }
.info-icon-btn{ display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; border:1px solid var(--border); background:transparent; color:var(--text-dim); cursor:pointer; padding:0; flex-shrink:0; }
.info-icon-btn:hover, .info-icon-btn:focus-visible{ color:#fff; border-color:var(--blue); background:var(--blue-soft); }
.info-icon-btn svg{ width:12px; height:12px; }
.diff-help-text{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin:-2px 0 12px; font-size:0.85em; color:var(--text-dim); }
.critical-flag{ color:#ffb84f !important; font-weight:700; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 18px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-weight:600; font-size:0.95em; cursor:pointer; min-height:44px; }
.btn:active{ transform:scale(0.97); }
@media (hover:hover) and (pointer:fine){ .btn:hover{ border-color:var(--blue); } .btn-primary:hover{ filter:brightness(1.1); } }
.btn-primary{ background:linear-gradient(145deg, var(--accent), var(--accent-dim)); border-color:var(--accent-dim); color:#fff; width:100%; margin-top:14px; }
.btn-block{ width:100%; margin-top:8px; }

.tabs{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; background:repeating-linear-gradient(90deg, rgba(47,174,96,0.16) 0 22px, rgba(47,174,96,0.05) 22px 44px); padding:6px; border-radius:14px; border:1px solid var(--border); }
.tab-btn{ flex:1; min-width:140px; }
.tab-btn.active{ background:linear-gradient(145deg, var(--accent), var(--accent-dim)); border-color:var(--accent-dim); color:#fff; }
.tab-content{ display:none; }
.tab-content.active{ display:block; }

.loader-box{ text-align:center; margin-top:16px; color:var(--text-dim); font-size:0.9em; }
.loader-spin{ width:34px; height:34px; margin:0 auto 10px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--accent); animation:spin 0.9s linear infinite; }

#campaign-output{ display:none; margin-top:20px; border-top:1px solid var(--border); padding-top:18px; }
.pdf-preview{ background:#fdf8ee; padding:0 0 24px; box-shadow:0 4px 16px rgba(0,0,0,0.35); font-family:'Inter',sans-serif; color:#2b2b2b; margin-bottom:24px; border-radius:10px; overflow:hidden; }
.pdf-header{ display:flex; flex-wrap:wrap; }
.pdf-header .title-block{ flex:1 1 240px; background:linear-gradient(135deg,#e8991f,#c76c12); color:#fff; padding:22px 24px; }
.pdf-header .title-block h1{ margin:0; font-size:28px; text-transform:uppercase; font-weight:normal; letter-spacing:0.5px; line-height:1.08; text-shadow:0 1px 3px rgba(0,0,0,0.25); }
.pdf-header .subtitle-arc{ font-size:13.5px; opacity:0.95; margin-top:6px; font-weight:700; font-style:italic; }
.pdf-header .meta-block{ background:linear-gradient(135deg,#b35c0e,#8a460a); color:#fff; padding:18px 22px; text-align:center; min-width:150px; display:flex; flex-direction:column; justify-content:center; gap:4px; border-left:3px solid rgba(255,255,255,0.5); }
.pdf-header .meta-block .team-crest{ width:46px; height:46px; border-radius:50%; object-fit:cover; margin:0 auto 8px; border:2px solid #e8991f; }
.pdf-header .meta-block .chapter-badge{ font-size:18px; font-weight:800; color:#ffd479; letter-spacing:0.5px; }
.pdf-header .meta-block .meta-line{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:#d8d2c8; }
.pdf-preview .pdf-narrative{ background:linear-gradient(135deg,#eda43f,#d68a1e); color:#fff; padding:16px 24px; font-size:14px; font-style:italic; line-height:1.55; margin:20px 24px; border-radius:8px; box-shadow:inset 0 0 0 2px rgba(255,255,255,0.28); }
.pdf-field{ position:relative; margin:0 24px 18px; padding:20px 20px 4px; border-radius:10px; overflow:hidden; background:repeating-linear-gradient(135deg, #2f9e4f 0px, #2f9e4f 34px, #278a45 34px, #278a45 68px); box-shadow:inset 0 0 0 3px rgba(255,255,255,0.4); }
.pdf-field::before{ content:''; position:absolute; left:50%; top:0; bottom:0; width:2px; background:rgba(255,255,255,0.4); transform:translateX(-50%); pointer-events:none; }
.pdf-field::after{ content:''; position:absolute; left:50%; top:50%; width:84px; height:84px; margin:-42px 0 0 -42px; border:2px solid rgba(255,255,255,0.4); border-radius:50%; pointer-events:none; }
.pdf-field .ribbon-row{ position:relative; z-index:1; margin:0 0 18px; }
.pdf-field .pdf-result{ position:relative; z-index:1; margin:0 0 4px; }
.ribbon-row{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin:0 24px 18px; }
@media (max-width:560px){ .ribbon-row{ grid-template-columns:1fr; } }
.ribbon-box{ background:#f1ede2; border-radius:8px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.12); }
.ribbon-box .ribbon-title{ background:#1f5fa8; color:#fff; text-align:center; padding:12px 10px 20px; font-family:var(--font-display); font-weight:normal; text-transform:uppercase; font-size:18px; letter-spacing:0.5px; clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%); }
.ribbon-box.goals .ribbon-title{ background:#1a8f4c; }
.ribbon-box .ribbon-stars{ display:block; letter-spacing:5px; color:rgba(255,255,255,0.85); font-size:10px; margin-top:3px; }
.ribbon-box .ribbon-body{ padding:8px 16px 16px; font-size:13px; line-height:1.5; }
.ribbon-box .ribbon-body h4{ margin:10px 0 6px; font-size:11.5px; text-transform:uppercase; letter-spacing:0.5px; color:#1a8f4c; }
.ribbon-box.setup .ribbon-body h4{ color:#1f5fa8; }
.ribbon-box .ribbon-body h4:first-child{ margin-top:0; }
.ribbon-box ul{ margin:0 0 4px; padding-left:0; list-style:none; }
.ribbon-box li{ margin-bottom:6px; padding-left:16px; position:relative; }
.ribbon-box li::before{ content:'»'; position:absolute; left:0; font-weight:800; color:#1a8f4c; }
.ribbon-box.setup li::before{ color:#1f5fa8; }
.pdf-result{ background:#2b2b2b; color:#fff; border-radius:8px; padding:16px 20px; margin:0 24px 14px; }
.pdf-result .result-tab{ display:inline-block; background:#c0392b; font-family:var(--font-display); font-weight:normal; text-transform:uppercase; font-size:14px; letter-spacing:0.5px; padding:4px 14px; border-radius:4px; margin-bottom:8px; }
.pdf-result p{ font-size:12.5px; line-height:1.5; margin:6px 0; color:#e8e5df; }
.pdf-continuity{ background:#161616; color:#f0ede6; font-size:11.5px; font-style:italic; padding:10px 20px; margin:0 24px; border-radius:6px; text-align:left; display:flex; align-items:center; gap:8px; }
.pdf-continuity svg{ flex-shrink:0; width:18px; height:18px; color:#e8991f; }

.solver-grid{ display:grid; grid-template-columns:1fr; gap:14px; }
.team-panel{ background:var(--surface-2); padding:14px; border-radius:12px; border:1px solid var(--border); }
.team-panel h3{ margin-top:0; color:var(--accent); text-align:center; border-bottom:2px solid var(--accent-dim); padding-bottom:8px; }
.gk-row{ display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; font-size:0.85em; color:var(--text-dim); }
.gk-row input{ width:64px; display:inline-block; padding:6px; }

.setup-pitch{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); grid-template-areas:"al ac ar" "ml mc mr" "dl dc dr"; gap:8px; margin-bottom:12px; padding:10px; border:1px solid var(--border); border-radius:12px; background:repeating-linear-gradient(180deg, rgba(47,174,96,0.09) 0 34px, rgba(47,174,96,0.02) 34px 68px); }
@media (max-width:700px){ .setup-pitch{ grid-template-columns:1fr; grid-template-areas:"al" "ac" "ar" "ml" "mc" "mr" "dl" "dc" "dr"; } }
@media (min-width:1000px){ body{ max-width:1200px; } }
.setup-zone{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px; display:flex; flex-direction:column; gap:6px; min-height:56px; transition:background 0.15s, border-color 0.15s; }
.setup-zone.al{ grid-area:al; } .setup-zone.ac{ grid-area:ac; } .setup-zone.ar{ grid-area:ar; }
.setup-zone.ml{ grid-area:ml; } .setup-zone.mc{ grid-area:mc; } .setup-zone.mr{ grid-area:mr; }
.setup-zone.dl{ grid-area:dl; } .setup-zone.dc{ grid-area:dc; } .setup-zone.dr{ grid-area:dr; }
.setup-zone-label{ font-size:0.68em; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-dim); text-align:center; }
.setup-zone.drag-over{ background:var(--blue-soft); border-color:var(--blue); box-shadow:0 0 0 2px var(--blue-glow) inset; }
.setup-zone-list{ display:flex; flex-direction:column; gap:5px; min-height:6px; }

.area-group{ margin-bottom:12px; background:var(--surface); padding:10px; border-radius:10px; border:1px solid var(--border); }
.area-group h4{ margin:0 0 8px; font-size:0.78em; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-dim); }
.player-entry{ display:flex; gap:6px; margin-bottom:0; align-items:center; flex-wrap:wrap; font-size:0.76em; color:var(--text-dim); background:var(--surface-2); border:1px solid var(--border); border-left:4px solid var(--blue); border-radius:8px; padding:5px 6px; cursor:grab; }
.player-entry.type-att{ border-left-color:var(--gold); }
.player-entry.dragging{ opacity:0.35; }
.player-entry .drag-handle{ color:var(--text-dim); font-size:0.95em; user-select:none; cursor:grab; flex-shrink:0; }
.player-entry input[type=number]{ width:44px; padding:5px; }
.player-entry select{ padding:5px; flex:1; min-width:78px; }
.player-entry select.p-zone{ flex:1 1 100%; min-width:0; }
.player-entry button{ background:#c0392b; color:#fff; border:none; border-radius:6px; padding:5px 9px; cursor:pointer; min-height:30px; }
.add-player-btn{ background:var(--accent); color:#fff; border:none; padding:6px 10px; border-radius:8px; cursor:pointer; font-size:0.78em; margin-top:2px; min-height:32px; }

.tactic-picker select{ width:100%; padding:8px; margin-bottom:8px; }
.formation-row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:0.85em; color:var(--text-dim); margin-bottom:8px; }
.formation-row select{ width:auto; flex:1; min-width:90px; margin-bottom:0; }
.btn-auto-arrange{ background:var(--accent-dim); color:#fff; border:none; padding:7px 10px; border-radius:8px; cursor:pointer; font-size:0.82em; min-height:34px; }
.tactic-card{ background:var(--surface-2); border:1px dashed var(--border); border-radius:8px; padding:8px 10px; font-size:0.82em; color:var(--text-dim); }
.tactic-card p{ margin:0 0 6px; }
.opp-above-row{ display:flex; align-items:center; gap:6px; cursor:pointer; font-size:0.92em; color:var(--text); }
.opponent-card-picker .formation-row select{ flex:1; }
.opponent-card-hint{ margin:0; font-size:0.76em; color:var(--text-dim); }
.player-entry select.p-zone{ font-size:0.9em; min-width:78px; }

#match-result-box{ display:none; margin-top:16px; }
.btn-solve{ background:linear-gradient(145deg, var(--gold), #c9980c); color:#221a02; border:none; padding:14px 20px; font-size:1.05em; font-weight:800; border-radius:10px; cursor:pointer; width:100%; margin-top:16px; min-height:48px; }

.scoreboard{ display:flex; align-items:center; justify-content:center; gap:16px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px; }
.scoreboard .side{ flex:1; text-align:center; min-width:0; }
.scoreboard .team-name{ font-size:0.62em; text-transform:uppercase; letter-spacing:0.8px; color:var(--text-dim); font-weight:700; line-height:1.25; }
.scoreboard .score-num{ font-family:var(--font-display); font-size:2.4em; line-height:1; color:var(--text); transition:transform 0.2s; }
.scoreboard .score-num.you{ color:var(--accent); }
.scoreboard .score-num.opp{ color:#e75a4c; }
.scoreboard .score-num.bump{ animation:popIn 0.45s ease; }
.scoreboard .vs{ color:var(--text-dim); font-family:var(--font-display); font-size:1.4em; padding-top:0.2em; }

.pitch{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.pitch-zone{ position:relative; display:flex; align-items:center; justify-content:space-between; gap:8px; background:linear-gradient(90deg, rgba(47,174,96,0.16), rgba(47,174,96,0.03) 50%, rgba(231,90,76,0.14)); border:1px solid var(--border); border-radius:10px; padding:8px 10px; min-height:38px; }
.pitch-zone .zone-label{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:0.66em; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-dim); pointer-events:none; white-space:nowrap; }
.zone-side{ display:flex; gap:5px; flex-wrap:wrap; min-width:60px; z-index:1; }
.zone-side.right{ justify-content:flex-end; }
.shirt-chip{ display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:6px; font-size:0.7em; font-weight:800; color:#fff; background:var(--border); animation:popIn 0.35s ease; flex-shrink:0; }
.shirt-chip.goal{ background:linear-gradient(145deg, var(--gold), #c9980c); color:#221a02; box-shadow:0 0 10px rgba(241,196,15,0.7); }
.shirt-chip.save{ background:#5c6b78; }
.shirt-chip.blocked{ background:#3a4048; opacity:0.7; }
.pitch-zone.flash{ animation:zoneFlash 0.7s ease; }
@keyframes zoneFlash{ 0%{ box-shadow:0 0 0 0 rgba(241,196,15,0.55);} 100%{ box-shadow:0 0 0 12px rgba(241,196,15,0);} }

.commentary-feed{ background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:12px 14px; max-height:230px; overflow-y:auto; font-size:0.86em; text-align:left; }
.commentary-feed p{ margin:0 0 8px; padding-bottom:8px; border-bottom:1px dashed var(--border); animation:fadeSlideUp 0.35s ease both; color:var(--text-dim); }
.commentary-feed p:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; color:var(--text); }
.commentary-feed .tag-goal{ color:var(--gold); font-weight:800; }
.commentary-feed .tag-save{ color:#9aa4b2; font-weight:700; }
.commentary-feed .tag-header{ color:var(--accent); font-weight:700; text-transform:uppercase; font-size:0.85em; letter-spacing:0.5px; }
.btn-skip{ width:auto; margin:10px auto 0; display:block; font-size:0.82em; padding:8px 16px; }
.final-summary{ margin-top:14px; text-align:center; animation:fadeSlideUp 0.4s ease both; }
.final-summary .ft-badge{ display:inline-block; background:var(--accent-dim); color:#fff; padding:3px 12px; border-radius:20px; font-size:0.72em; letter-spacing:1.5px; margin-bottom:10px; text-transform:uppercase; }
.final-summary .scorers-row{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:8px; }

.credits{ display:flex; align-items:center; gap:12px; }
.credits img{ width:52px; height:52px; border-radius:10px; object-fit:cover; }
.credits a{ color:var(--blue); text-decoration:none; }
@media (hover:hover) and (pointer:fine){ .credits a:hover{ text-decoration:underline; } }

.bmc-inline{ display:flex; justify-content:center; align-items:center; gap:8px; margin:14px auto; background:#FFDD00; color:#000; font-weight:700; font-size:0.85em; padding:9px 16px; border-radius:8px; text-decoration:none; box-shadow:0 4px 14px rgba(0,0,0,0.35); transition:transform 0.15s; width:max-content; }
.bmc-inline:hover{ transform:scale(1.05); }
.bmc-inline svg{ width:18px; height:18px; flex-shrink:0; }

.btn-help-float{ position:fixed; bottom:20px; right:20px; width:50px; height:50px; border-radius:50%; background:var(--accent); color:#fff; border:none; font-size:1.3em; font-weight:800; box-shadow:0 4px 14px rgba(0,0,0,0.4); z-index:50; }
.modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:100; display:flex; align-items:center; justify-content:center; padding:18px; }
.modal{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); max-width:640px; width:100%; max-height:85vh; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:20px; }
.modal h3{ color:var(--accent); }
.modal-close{ float:right; }
.lang-switch{ position:fixed; top:14px; right:14px; z-index:60; display:flex; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:4px; }
.lang-switch button{ border:none; background:transparent; color:var(--text-dim); padding:5px 10px; border-radius:16px; font-size:0.8em; font-weight:700; min-height:30px; }
.lang-switch button.active{ background:var(--accent); color:#fff; }
@media (min-width:600px){ .hero img{ height:210px; } h1{ font-size:2.4em; } }
</style>

let lang = localStorage.getItem(LANG_KEY) || 'pt';
function t(k){ return I18N[lang][k] || k; }
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{ el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{ el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>{ el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  document.getElementById('btnPt').classList.toggle('active', lang==='pt');
  document.getElementById('btnEn').classList.toggle('active', lang==='en');
  document.documentElement.lang = lang==='en' ? 'en' : 'pt-BR';
  document.title = lang==='pt' ? 'Eleven — Gerador de Campanha & Resolvedor de Partidas (v1)' : 'Eleven — Campaign Generator & Match Solver (v1)';
  if (typeof populateTeamSelect === 'function') populateTeamSelect(true);
  if (typeof populateTacticSelect === 'function') populateTacticSelect();
  if (typeof populateOpponentCardSelect === 'function') populateOpponentCardSelect();
}
function setLang(l){ lang=l; localStorage.setItem(LANG_KEY,l); applyI18n(); if (typeof onLanguageChanged === 'function') onLanguageChanged(l); }

function switchTab(tabId){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  document.getElementById(tabId==='campaign' ? 'tabBtnCampaign' : 'tabBtnSolver').classList.add('active');
}

// ---- Solver UI ----
// The Pitch is a 3x3 grid of 9 independent Zones (see eleven_solver.js
// header): Attack row (al/ac/ar), Mid row (ml/mc/mr), Defense row (dl/dc/dr).
// Each Zone is resolved on its own against its diagonally mirrored Zone.
const areas = ['al', 'ac', 'ar', 'ml', 'mc', 'mr', 'dl', 'dc', 'dr'];
const AREA_I18N_KEY = { al:'zoneAl', ac:'zoneAc', ar:'zoneAr', ml:'zoneMl', mc:'zoneMc', mr:'zoneMr', dl:'zoneDl', dc:'zoneDc', dr:'zoneDr' };

// Historical squad numbering: shirt 1 is reserved for the Goalkeeper (not
// shown as a shirt input, GK has no Zone), outfield shirts are ascending
// Defense -> Mid -> Attack, left to right within each row, starting at 2.
const SHIRT_NUMBERING_ORDER = ['dl', 'dc', 'dr', 'ml', 'mc', 'mr', 'al', 'ac', 'ar'];

function renumberShirts(prefix){
  let shirt = 2;
  SHIRT_NUMBERING_ORDER.forEach(area=>{
    document.querySelectorAll(`#${prefix}-${area}-list .player-entry .p-shirt`).forEach(input=>{ input.value = shirt++; });
  });
}

function createAreaUI(containerId, prefix){
  const container = document.getElementById(containerId);
  container.classList.add('setup-pitch');
  areas.forEach(area=>{
    const zone = document.createElement('div');
    zone.className = `setup-zone ${area}`;
    zone.ondragover = (e)=>{ e.preventDefault(); zone.classList.add('drag-over'); };
    zone.ondragleave = ()=> zone.classList.remove('drag-over');
    zone.ondrop = (e)=>{ e.preventDefault(); zone.classList.remove('drag-over'); handleZoneDrop(prefix, area); };
    zone.innerHTML = `<div class="setup-zone-label" data-i18n="${AREA_I18N_KEY[area]}"></div><div class="setup-zone-list" id="${prefix}-${area}-list"></div><button class="add-player-btn" data-i18n="addPlayerBtn" onclick="addPlayer('${prefix}', '${area}')"></button>`;
    container.appendChild(zone);
  });
}

// Drag-and-drop state for moving a player entry between pitch zones — the
// per-entry zone <select> (see addPlayer) remains as an accessible/mobile
// fallback for the exact same move, both paths funnel through moveEntryToZone.
let draggedPlayerEntry = null;

function handleZoneDrop(prefix, area){
  if(!draggedPlayerEntry || draggedPlayerEntry.prefix !== prefix) return;
  moveEntryToZone(draggedPlayerEntry.el, prefix, area);
  draggedPlayerEntry = null;
}

function addPlayer(prefix, area, opts){
  opts = opts || {};
  const list = document.getElementById(`${prefix}-${area}-list`);
  const div = document.createElement('div');
  div.className = 'player-entry';
  div.draggable = true;
  div.innerHTML = `
    <span class="drag-handle">☷</span>
    <span data-i18n="lblPow"></span> <input type="number" value="1" min="0" class="p-pow">
    <span data-i18n="lblType"></span> <select class="p-type"><option value="att" data-i18n="optAttacker"></option><option value="def" data-i18n="optDefender"></option></select>
    <span data-i18n="lblShirt"></span> <input type="number" value="1" min="1" max="99" class="p-shirt">
    <span data-i18n="lblZone"></span> <select class="p-zone">${areas.map(a=>`<option value="${a}" data-i18n="${AREA_I18N_KEY[a]}"></option>`).join('')}</select>
    <button onclick="removePlayerEntry(this, '${prefix}')">✕</button>
  `;
  list.appendChild(div);
  div.querySelector('.p-zone').value = area;
  div.querySelector('.p-zone').onchange = function(){ moveEntryToZone(div, prefix, this.value); };
  div.querySelector('.p-type').onchange = function(){ div.classList.toggle('type-att', this.value === 'att'); };
  div.ondragstart = ()=>{ draggedPlayerEntry = { el: div, prefix }; div.classList.add('dragging'); };
  div.ondragend = ()=> div.classList.remove('dragging');
  if (opts.isAttacker === false) {
    div.querySelector('.p-type').value = 'def';
  } else {
    div.classList.add('type-att');
  }
  applyI18n();
  renumberShirts(prefix);
}

function removePlayerEntry(btn, prefix){
  btn.parentElement.remove();
  renumberShirts(prefix);
}

function moveEntryToZone(entryEl, prefix, newArea){
  document.getElementById(`${prefix}-${newArea}-list`).appendChild(entryEl);
  const zoneSelect = entryEl.querySelector('.p-zone');
  if(zoneSelect) zoneSelect.value = newArea;
  applyI18n();
  renumberShirts(prefix);
}

// ---- Opponent Card picker (OP001-OP064, ported from the official card data) ----
function populateOpponentCardSelect(){

function loadOpponentCard(){

function populateTacticSelect(){

    TACTICS.map(tc => `<option value="${tc.id}">${tc.name[lang] || tc.name.pt}</option>`).join('');

function onTacticChange(){
  const tactic = getTactic(document.getElementById('pl-tactic').value);
  const formationRow = document.getElementById('pl-formation-row');

// Formation choice itself has no separate rendering step beyond the ability
// text already shown by onTacticChange() — kept as a named function since
// it's wired to the formation <select>'s onchange in the HTML.
function renderTacticCard(){}

function autoArrangeFormation(){
  const tactic = getTactic(document.getElementById('pl-tactic').value);
  if(!tactic) return;
  const formationKey = document.getElementById('pl-formation').value;
  if(!FORMATIONS[formationKey]) return;
  const layout = suggestZoneLayout(formationKey);
  areas.forEach(area=>{
    document.getElementById(`pl-${area}-list`).innerHTML = '';
    (layout[area] || []).forEach((posType, idx) => addPlayer('pl', area, { isAttacker: defaultIsAttacker(posType, idx) }));
  });
}

populateTacticSelect();

// Match resolution only cares about 5 Sections (see eleven_solver.js) —
// the 3 Zones on each side pool into one Wing, central Zones stay solo.
const RESULT_AREAS = ['Left', 'Right', 'Attack', 'Mid', 'Defense'];
const RESULT_AREA_I18N_KEY = { Left:'areaLeft', Right:'areaRight', Attack:'areaAttack', Mid:'areaMid', Defense:'areaDefense' };

function buildTeamObj(prefix){
  let team = {
    GK: { power: parseInt(document.getElementById(`${prefix}-gk-pow`).value) || 0, gloves: parseInt(document.getElementById(`${prefix}-gk-gloves`).value) || 0 }
  };
  const raw = {};
  areas.forEach(area=>{
    raw[area] = [];
    document.querySelectorAll(`#${prefix}-${area}-list .player-entry`).forEach(el=>{
      raw[area].push({
        power: parseInt(el.querySelector('.p-pow').value) || 0,
        isAttacker: el.querySelector('.p-type').value === 'att',
        shirt: parseInt(el.querySelector('.p-shirt').value) || 0
      });
    });
  });
  team.Left = [...raw.al, ...raw.ml, ...raw.dl];
  team.Right = [...raw.ar, ...raw.mr, ...raw.dr];
  team.Attack = raw.ac;
  team.Mid = raw.mc;
  team.Defense = raw.dc;
  return team;
}

// ---- Broadcast / narrated match resolution ----
const COMMENTARY = {
  pt:{
    kickoff:['Apito inicial! A bola rola em busca de gols.','Tudo pronto! É hora de decidir esta partida.','O árbitro dá o pontapé de saída. Vamos ao jogo!'],
    zone:['A jogada se desenrola pela {area}...','Duelo tático na {area}.','Ação disputada na {area}.'],
    blocked:['Camisa {shirt} tenta pela {area}, mas é bem travado pela marcação!','Belo desarme! A zaga aborta a investida do Camisa {shirt}.','Camisa {shirt} esbarra na defesa adversária e perde a bola.','Interceptação segura! O Camisa {shirt} nem viu a bola passar.'],
    actHeaderPlayer:['Agora é a vez do seu time atacar!','Sua equipe parte para cima em busca do gol.','Pressão do seu time lá na frente!'],
    actHeaderNpc:['Contra-ataque do adversário!','Agora o rival parte para cima.','O adversário responde com perigo!'],
    goal:['GOOOOL! Camisa {shirt} não desperdiça e balança as redes pela {area}!','É GOL! Estourou a rede, Camisa {shirt}!','Que finalização! Camisa {shirt} marca um golaço pela {area}!','Sem chances para o goleiro! Camisa {shirt} confirma o gol.'],
    save:['DEFESAAA fantástica! O goleiro evita o gol de Camisa {shirt}!','Que milagre! Encaixou a bola e negou o gol do Camisa {shirt}.','O goleiro se estica todo e espalma a finalização de Camisa {shirt}!','Segurou bonito! O arqueiro nega o gol certo de Camisa {shirt}.'],
    fulltime:['Apito final! Fim de jogo.','Está encerrada a partida!','E é o apito final do árbitro!'],
    injuryTime:['⏱ Já nos acréscimos...','Estamos nos minutos finais da partida...','Faltam só os acréscimos para o apito final...'],
    tacticBonusFlavor:['Um contra-ataque incrível nos acréscimos! A tática {tactic} vira o placar!','Direto do banco de táticas: {tactic} entra em ação e decide a partida nos minutos finais!','Que virada nos acréscimos! A tática {tactic} garante mais um gol para o seu time!','Nos instantes finais, a tática {tactic} rouba a cena e sela o resultado!']
  },
  en:{
    kickoff:['Kickoff! The match is under way.','Everything is set! Time to decide this match.','The referee blows the whistle. Let\'s get started!'],
    zone:['Play develops down the {area}...','A tactical duel in the {area}.','Contested action in the {area}.'],
    blocked:['Shirt {shirt} tries down the {area}, but is well shut down by the marking!','Great tackle! The defense stops shirt {shirt}\'s run.','Shirt {shirt} runs into the defense and loses the ball.','Solid interception! Shirt {shirt} never saw it coming.'],
    actHeaderPlayer:['Now it\'s your team\'s turn to attack!','Your side pushes forward looking for the goal.','Your team is piling on the pressure!'],
    actHeaderNpc:['The opponent counter-attacks!','Now the rival pushes forward.','The opponent responds dangerously!'],
    goal:['GOAAAL! Shirt {shirt} makes no mistake down the {area}!','It\'s a GOAL! The net bulges, shirt {shirt}!','What a finish! Shirt {shirt} scores a beauty down the {area}!','No chance for the keeper! Shirt {shirt} confirms the goal.'],
    save:['WHAT A SAVE! The keeper denies shirt {shirt}!','Unbelievable stop! The keeper keeps out shirt {shirt}\'s effort.','The keeper stretches out to palm away shirt {shirt}\'s shot!','Superbly held! The keeper denies a certain goal from shirt {shirt}.'],
    fulltime:['Full time! The match is over.','That\'s the final whistle!','And there goes the referee\'s final whistle!'],
    injuryTime:['⏱ Deep into injury time...','We\'re in the dying minutes of the match...','Only stoppage time remains before the final whistle...'],
    tacticBonusFlavor:['An amazing last-minute counterattack! The {tactic} tactic turns the match around!','Straight from the tactics bench: {tactic} kicks in and decides the match in the final minutes!','What a turnaround in injury time! The {tactic} tactic secures one more goal for your side!','In the dying seconds, the {tactic} tactic steals the show and seals the result!']
  }
};
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function fill(str, vars){ return str.replace(/\{(\w+)\}/g, (_,k)=> vars[k] !== undefined ? vars[k] : ''); }

let broadcastTimer = null;

function buildBeats(res, tacticBonusInfo){
  const beats = [];
  beats.push({kind:'kickoff'});
  res.chances.forEach(c=>{
    if(!c.blocked.length) return;
    beats.push({kind:'zone', area:c.area});
    c.blocked.forEach(p=> beats.push({kind:'blocked', side:c.side, shirt:p.shirt, area:c.area}));
  });
  if(res.finish.player.length){
    beats.push({kind:'actHeader', side:'player'});
    res.finish.player.forEach(f=> beats.push({kind:f.result, side:'player', shirt:f.shot.shirt, area:f.shot.area}));
  }
  if(res.finish.npc.length){
    beats.push({kind:'actHeader', side:'npc'});
    res.finish.npc.forEach(f=> beats.push({kind:f.result, side:'npc', shirt:f.shot.shirt, area:f.shot.area}));
  }
  if(tacticBonusInfo){
    beats.push({kind:'injuryTime'});
    beats.push({kind:'tacticBonus', tactic:tacticBonusInfo.tactic});
  }
  beats.push({kind:'fulltime'});
  return beats;
}

function beatToLine(beat){
  const c = COMMENTARY[lang] || COMMENTARY.pt;
  const areaLabel = beat.area ? t(RESULT_AREA_I18N_KEY[beat.area]) : '';
  switch(beat.kind){
    case 'kickoff': return { html: pick(c.kickoff), cls:'' };
    case 'zone': return { html: fill(pick(c.zone), {area:areaLabel}), cls:'tag-header' };
    case 'blocked': return { html: fill(pick(c.blocked), {shirt:beat.shirt, area:areaLabel}), cls:'' };
    case 'actHeader': return { html: pick(beat.side==='player' ? c.actHeaderPlayer : c.actHeaderNpc), cls:'tag-header' };
    case 'goal': return { html: `<span class="tag-goal">${fill(pick(c.goal), {shirt:beat.shirt, area:areaLabel})}</span>`, cls:'' };
    case 'save': return { html: `<span class="tag-save">${fill(pick(c.save), {shirt:beat.shirt, area:areaLabel})}</span>`, cls:'' };
    case 'fulltime': return { html: `<strong>${pick(c.fulltime)}</strong>`, cls:'' };
    case 'injuryTime': return { html: pick(c.injuryTime), cls:'tag-header' };
    case 'tacticBonus': return { html: `<span class="tag-goal">${fill(pick(c.tacticBonusFlavor), {tactic:beat.tactic})}</span>`, cls:'' };
  }
  return { html:'', cls:'' };
}

function renderPitchShell(){
  return `<div class="pitch">${RESULT_AREAS.map(a=>`
    <div class="pitch-zone" id="zone-${a}">
      <div class="zone-side left" id="zone-${a}-player"></div>
      <div class="zone-label">${t(RESULT_AREA_I18N_KEY[a])}</div>
      <div class="zone-side right" id="zone-${a}-npc"></div>
    </div>`).join('')}</div>`;
}

function addChip(area, side, cls, shirt){
  const holder = document.getElementById(`zone-${area}-${side}`);
  if(!holder) return;
  const chip = document.createElement('span');
  chip.className = `shirt-chip ${cls}`;
  chip.textContent = shirt;
  holder.appendChild(chip);
  const zone = document.getElementById(`zone-${area}`);
  if(zone){ zone.classList.remove('flash'); void zone.offsetWidth; zone.classList.add('flash'); }
}

function bumpScore(side){
  const el = document.getElementById(side==='player' ? 'score-you' : 'score-opp');
  if(!el) return;
  el.textContent = (parseInt(el.textContent)||0) + 1;
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}

function playBeats(beats, res){
  let i = 0;
  const feed = document.getElementById('commentary-feed');
  const skipBtn = document.getElementById('btn-skip-broadcast');

  function step(){
    if(i >= beats.length){
      if(skipBtn) skipBtn.classList.add('hidden');
      renderFinalSummary(res);
      return;
    }
    const beat = beats[i];
    const line = beatToLine(beat);
    const p = document.createElement('p');
    p.className = line.cls;
    p.innerHTML = line.html;
    feed.appendChild(p);
    feed.scrollTop = feed.scrollHeight;

    if(beat.kind === 'blocked') addChip(beat.area, beat.side, 'blocked', beat.shirt);
    if(beat.kind === 'goal'){ addChip(beat.area, beat.side, 'goal', beat.shirt); bumpScore(beat.side); }
    if(beat.kind === 'save'){ addChip(beat.area, beat.side==='player' ? 'npc' : 'player', 'save', beat.shirt); }
    if(beat.kind === 'tacticBonus'){ bumpScore('player'); }

    i++;
    broadcastTimer = setTimeout(step, 700);
  }
  step();
}

function skipBroadcast(beats, res){
  clearTimeout(broadcastTimer);
  const feed = document.getElementById('commentary-feed');
  feed.innerHTML = '';
  RESULT_AREAS.forEach(a=>{
    document.getElementById(`zone-${a}-player`).innerHTML = '';
    document.getElementById(`zone-${a}-npc`).innerHTML = '';
  });
  beats.forEach(beat=>{
    const line = beatToLine(beat);
    const p = document.createElement('p');
    p.className = line.cls;
    p.innerHTML = line.html;
    feed.appendChild(p);
    if(beat.kind === 'blocked') addChip(beat.area, beat.side, 'blocked', beat.shirt);
    if(beat.kind === 'goal'){ addChip(beat.area, beat.side, 'goal', beat.shirt); }
    if(beat.kind === 'save'){ addChip(beat.area, beat.side==='player' ? 'npc' : 'player', 'save', beat.shirt); }
  });
  feed.scrollTop = feed.scrollHeight;
  document.getElementById('score-you').textContent = res.TeamGoals;
  document.getElementById('score-opp').textContent = res.NPCGoals;
  document.getElementById('btn-skip-broadcast').classList.add('hidden');
  renderFinalSummary(res);
}

function renderFinalSummary(res){
  const wrap = document.getElementById('final-summary');
  if(!wrap) return;
  const chips = res.TeamScorers.length
    ? res.TeamScorers.map(s=>`<span class="shirt-chip goal">${s}</span>`).join('')
    : `<span style="color:var(--text-dim); font-size:0.85em;">${t('resultNone')}</span>`;
  wrap.innerHTML = `
    <div class="ft-badge">${t('resultFullTime')}</div>
    <div style="font-size:0.85em; color:var(--text-dim);">${t('resultScorers')}</div>
    <div class="scorers-row">${chips}</div>
  `;
}

function solveMatch(){
  const playerTeam = buildTeamObj('pl');
  const npcTeam = buildTeamObj('npc');

  const tactic = getTactic(document.getElementById('pl-tactic').value);
  const effectiveTeam = (tactic && tactic.preEffect) ? tactic.preEffect(playerTeam) : playerTeam;

  const res = ElevenSolver.resolveMatch(effectiveTeam, npcTeam);

  let tacticBonus = 0;
  if(tactic && tactic.autoResolvable && tactic.postEffect){
    const oppAboveEl = document.getElementById('pl-opp-above-league');
    const extra = { oppAboveLeague: oppAboveEl ? oppAboveEl.checked : false };
    tacticBonus = tactic.postEffect(effectiveTeam, npcTeam, res, extra) || 0;
  }
  if(tacticBonus > 0) res.TeamGoals += tacticBonus;

  const beats = buildBeats(res, tacticBonus > 0 ? { tactic: tactic.name[lang] || tactic.name.pt } : null);

  const box = document.getElementById('match-result-box');
  box.style.display = 'block';
  box.innerHTML = `
    <div class="scoreboard">
      <div class="side"><div class="team-name">${t('resultYourTeam')}</div><div class="score-num you" id="score-you">0</div></div>
      <div class="vs">×</div>
      <div class="side"><div class="team-name">${t('resultOpponent')}</div><div class="score-num opp" id="score-opp">0</div></div>
    </div>
    ${renderPitchShell()}
    <div class="commentary-feed" id="commentary-feed"></div>
    <button class="btn btn-skip" id="btn-skip-broadcast" data-i18n="btnSkipNarration">${t('btnSkipNarration')}</button>
    <div class="final-summary" id="final-summary"></div>
  `;
  document.getElementById('btn-skip-broadcast').onclick = ()=> skipBroadcast(beats, res);
  box.scrollIntoView({ behavior:'smooth', block:'nearest' });
  playBeats(beats, res);
}

applyI18n();
</script>
